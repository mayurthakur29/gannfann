cense must be removed", "Nothing; providers can be deleted at any time"], "a": [0], "e": "NKP verifies whether managed clusters were created with the provider. Delete those clusters first so NKP still has access to remove their resources.", "r": "Deleting an infrastructure provider"}, {"id": "4.2-01", "obj": "4.2", "q": "Where in the NKP UI do you start creating a new managed Nutanix cluster in a workspace?", "o": ["In the workspace Dashboard, select Add Cluster, then the Create Cluster card", "In Global > Licensing, select New Cluster", "In a project's Continuous Deployment tab", "In Prism Central > Kubernetes"], "a": [0], "e": "In the selected workspace Dashboard, choose Add Cluster and then Create Cluster to open the provisioning form.", "r": "Specifying Nutanix Cluster Information"}, {"id": "4.2-02", "obj": "4.2", "q": "Which two prerequisites must be met before provisioning a managed Nutanix cluster from the NKP UI?", "o": ["A Nutanix infrastructure provider exists", "The network allows access from the management cluster to Prism Central", "The cluster's subnets are created automatically by NKP", "A Velero backup location is configured", "The workspace has an identity provider"], "a": [0, 1], "e": "You must create a Nutanix infrastructure before you can create additional clusters, and the network must allow seamless access from the management cluster to Prism Central. Subnets must be pre-created in Prism Central.", "r": "Creating a Managed Nutanix Cluster Through the NKP UI"}, {"id": "4.2-03", "obj": "4.2", "q": "In the cluster creation form, the SSH Username field is left blank. What happens?", "o": ["The default user name `konvoy` is created for the specified SSH public key", "SSH access is disabled on all nodes", "The `root` user is used", "The form cannot be submitted"], "a": [0], "e": "Leaving SSH Username blank creates the default user `konvoy` with the provided SSH public key as its authorized key.", "r": "Specifying Nutanix Cluster Information"}, {"id": "4.2-04", "obj": "4.2", "q": "What are the control plane node count options in the managed Nutanix cluster form?", "o": ["3 (default), 1 or 5", "1 (default) or 3", "Any number from 1 to 10", "Only 3"], "a": [0], "e": "The default control plane node count is 3; the other options are 1 or 5. A single-node control plane should not be used in production.", "r": "Configuring Nutanix Node Pool Information"}, {"id": "4.2-05", "obj": "4.2", "q": "Which two rules apply to the Control Plane Endpoint IP entered in the managed Nutanix cluster form?", "o": ["It must not belong to a DHCP range or the Nutanix IPAM address pool", "It is the virtual IP for the cluster's Kubernetes API server, using port 6443 by default", "It must be the IP of the first control plane VM", "It must be the Prism Central VIP", "It must be inside the MetalLB service range"], "a": [0, 1], "e": "The Control Plane Endpoint IP is the Kubernetes API VIP and must not be in a DHCP range or IPAM pool. The control plane endpoint port defaults to 6443.", "r": "Configuring Nutanix Node Pool Information"}, {"id": "4.2-06", "obj": "4.2", "q": "In the managed Nutanix cluster form, what is the default for worker node autoscaling?", "o": ["Disabled; when enabled, a minimum and maximum number of worker nodes are set", "Enabled with min 1 and max 10", "Enabled with no limits", "Autoscaling is not available in the UI"], "a": [0], "e": "Worker node autoscaling is disabled by default. If enabled, you set minimum and maximum worker nodes; otherwise you set a fixed worker node count.", "r": "Configuring Nutanix Node Pool Information"}, {"id": "4.2-07", "obj": "4.2", "q": "What does the 'Hypervisor attached Volumes' storage option do, and what is its default?", "o": ["Nutanix Volumes use the hypervisor's internal network for data traffic instead of external iSCSI connections; enabled by default", "Volumes are attached as NFS shares; disabled by default", "Volumes are stored on the bastion; enabled by default", "Volumes use Rook Ceph; disabled by default"], "a": [0], "e": "Hypervisor-attached Nutanix Volumes use the hypervisor internal network instead of external iSCSI connections. The option is enabled by default.", "r": "Configuring Nutanix Node Pool Information"}, {"id": "4.2-08", "obj": "4.2", "q": "Which persistent volume Reclaim Policy values does the managed cluster form allow, and which is the default?", "o": ["Retain or Delete; default is Delete", "Retain or Recycle; default is Retain", "Only Delete", "Only Retain"], "a": [0], "e": "The Reclaim Policy for persistent volumes can be Retain or Delete; the default is Delete.", "r": "Configuring Nutanix Node Pool Information"}, {"id": "4.2-09", "obj": "4.2", "q": "Which two Nutanix-specific placement options can be chosen for node pools in the managed cluster form?", "o": ["A Nutanix Prism Project to associate the node VMs with", "Nutanix Prism Categories added to the node VMs (the categories must already exist)", "A Nutanix Files share for node root disks", "A Nutanix Objects bucket per node", "A Prism Element protection domain per node"], "a": [0, 1], "e": "Each node pool can select a Prism Project (limiting the AOS clusters and subnets shown), an AOS cluster, subnets, an OS image and existing Prism Categories.", "r": "Configuring Nutanix Node Pool Information"}, {"id": "4.2-10", "obj": "4.2", "q": "Why can adding a label in the cluster creation form change which projects the cluster belongs to?", "o": ["Projects can select clusters dynamically by label, so a matching label adds the cluster to those projects", "Labels rename the cluster's namespace", "Labels change the workspace", "Labels are ignored by projects"], "a": [0], "e": "The docs note that adding a cluster label might add the cluster to NKP projects, because projects can use label selectors to associate clusters dynamically.", "r": "Specifying Nutanix Cluster Information"}, {"id": "4.2-11", "obj": "4.2", "q": "Since NKP 2.6, what happens after a managed cluster is created with the NKP CLI against the management cluster?", "o": ["It attaches automatically to the management cluster after a few moments", "It must always be attached manually with a kubeconfig", "It becomes a separate self-managed cluster", "It appears only in Prism Central"], "a": [0], "e": "Managed clusters created with the NKP CLI attach automatically to the management cluster. If no workspace namespace was set, the cluster lands in the default workspace.", "r": "NKP-created Kubernetes Cluster"}, {"id": "4.2-12", "obj": "4.2", "q": "An administrator wants a new CLI-created managed cluster to appear in the 'finance' workspace rather than the default workspace. What should be done when creating it?", "o": ["Set WORKSPACE_NAMESPACE to the finance workspace's namespace (from `kubectl get workspace -A`) and create the cluster in that namespace", "Create it in the default workspace and drag it to finance later", "Add the label `workspace=finance` after creation", "Create it with `--self-managed`"], "a": [0], "e": "A new managed cluster must be part of a workspace: find the workspace namespace and set WORKSPACE_NAMESPACE when creating the cluster. Clusters can't be moved between workspaces afterwards.", "r": "Create Managed Clusters Using the NKP CLI"}, {"id": "4.2-13", "obj": "4.2", "q": "Which two tasks should NOT be performed when creating additional managed clusters from the CLI?", "o": ["Creating and moving CAPI objects to the new cluster (making it self-managed)", "Installing the Kommander component on the new cluster", "Setting the workspace namespace", "Choosing a control plane endpoint", "Giving the cluster a unique lowercase name"], "a": [0, 1], "e": "When creating managed clusters, don't create and move CAPI objects or install Kommander — those tasks are only done on management clusters.", "r": "Create Managed Clusters Using the NKP CLI"}, {"id": "4.2-14", "obj": "4.2", "q": "A managed cluster was created from the CLI without a workspace and landed in the default workspace. How is it attached to another workspace from the CLI?", "o": ["Create a kubeconfig Secret for the cluster in the target workspace namespace, then create a KommanderCluster object that references the secret and the CAPI cluster", "Run `nkp move cluster --to-workspace`", "Delete the cluster and create it again", "Edit the cluster's labels"], "a": [0], "e": "Copy the `<cluster>-kubeconfig` secret value into a new Secret in the target workspace namespace, then create a `KommanderCluster` with `kubeconfigRef` and `clusterRef.capiCluster`. Check with `kubectl get kommanderclusters -A` until it is Joined.", "r": "Attaching an NKP-created Cluster Using the CLI"}, {"id": "4.2-15", "obj": "4.2", "q": "Which command shows whether attached and managed clusters have reached the Joined state?", "o": ["`kubectl get kommanderclusters -A`", "`nkp get nodes -A`", "`kubectl get machines -A`", "`nkp describe workspace`"], "a": [0], "e": "KommanderCluster objects represent clusters in workspaces; `kubectl get kommanderclusters -A` shows their status, such as Joined.", "r": "Attaching an NKP-created Cluster Using the CLI"}, {"id": "4.2-16", "obj": "4.2", "q": "How can a user generate a kubeconfig to access a managed or attached cluster from the NKP UI?", "o": ["Select the username in the top-right corner, select Generate Token, choose the cluster and follow the instructions (or use the /token endpoint)", "Download it from Prism Central", "Run `nkp get kubeconfig` on the attached cluster", "Copy the nkp-credentials secret"], "a": [0], "e": "After a cluster is attached, select your username > Generate Token, choose the cluster and follow the instructions to assemble a kubeconfig. The /token endpoint on the Kommander domain gives the same instructions.", "r": "Accessing a Managed or Attached Cluster"}, {"id": "4.3-01", "obj": "4.3", "q": "What is the basic network requirement for attaching an existing cluster from the NKP UI without a tunnel?", "o": ["The management cluster must be able to reach the target cluster's API server and services", "The target cluster must be able to reach Prism Central", "Both clusters must share the same pod CIDR", "The target cluster must be in the same Prism Element cluster"], "a": [0], "e": "To attach a cluster in the UI, the application management cluster must be able to reach the services and the API server of the target cluster.", "r": "Requirements for Attaching an Existing Cluster"}, {"id": "4.3-02", "obj": "4.3", "q": "An NKP-CLI-created cluster and an EKS cluster are both attached to a workspace. How are they classified?", "o": ["The NKP-CLI-created cluster becomes a Managed cluster; the EKS cluster becomes an Attached cluster", "Both become Attached clusters", "Both become Managed clusters", "The EKS cluster becomes the management cluster"], "a": [0], "e": "An NKP-CLI-created cluster becomes a Managed cluster on attachment (NKP manages its infrastructure, life cycle and apps). Other Kubernetes clusters such as AKS, EKS or GKE become Attached clusters (apps only).", "r": "Requirements for Attaching an Existing Cluster"}, {"id": "4.3-03", "obj": "4.3", "q": "Which storage requirement must a cluster meet before it is attached to NKP?", "o": ["A default StorageClass must be configured (annotation `storageclass.kubernetes.io/is-default-class: \"true\"`)", "It must use Rook Ceph as its CSI", "It must have no StorageClasses", "It must use the Nutanix CSI driver"], "a": [0], "e": "Many services deployed to attached clusters need a default StorageClass. Check with `kubectl get sc` and add the default-class annotation if needed.", "r": "Requirements for Attaching an Existing Cluster"}, {"id": "4.3-04", "obj": "4.3", "q": "Why must a separate service account and kubeconfig be created to attach existing AKS, EKS or GKE clusters?", "o": ["Their generated kubeconfig files call provider CLIs (aws, az, gcloud) and use locally obtained tokens that Kommander cannot use", "Kommander only supports certificate-based authentication", "Cloud kubeconfigs expire after one hour", "The provider CLIs are not allowed on the management cluster"], "a": [0], "e": "Kubeconfigs from cloud providers call provider-specific CLI commands and rely on locally obtained tokens. A dedicated service account also gives NKP its own isolated identity.", "r": "Creating a kubeconfig File for Attachment"}, {"id": "4.3-05", "obj": "4.3", "q": "Which two steps are part of creating the kubeconfig used to attach an existing cluster?", "o": ["Create the `kommander-cluster-admin` service account and a service-account-token secret in kube-system", "Bind the service account to the `cluster-admin` ClusterRole", "Bind the service account to the `view` ClusterRole only", "Export the cloud provider CLI credentials into the kubeconfig", "Create the service account in the management cluster"], "a": [0, 1], "e": "On the cluster to attach: create the kommander-cluster-admin service account and its token secret in kube-system, bind it to cluster-admin, then build kommander-cluster-admin-config from the token, CA and server and test it with kubectl.", "r": "Creating a kubeconfig File for Attachment"}, {"id": "4.3-06", "obj": "4.3", "q": "An existing cluster with its own cert-manager is attached. The NKP cert-manager HelmRelease fails. What should the administrator do?", "o": ["Ignore the failure as long as the pre-existing cert-manager works as expected", "Uninstall the existing cert-manager immediately", "Detach the cluster", "Disable Traefik"], "a": [0], "e": "If cert-manager is already installed, the NKP cert-manager HelmRelease fails to deploy. As long as the existing cert-manager functions, the failure has no impact. NKP supports only one cert-manager per cluster.", "r": "Requirements for Attaching Clusters with an Existing cert-manager Installation"}, {"id": "4.3-07", "obj": "4.3", "q": "How is a cluster with no networking restrictions attached from the NKP UI?", "o": ["Workspace Dashboard > Actions > Add Cluster > Attach Cluster > No additional networking restrictions, then paste or upload the kubeconfig, choose the context and Create", "Global > Licensing > Attach", "Project > Clusters > Import YAML", "Prism Central > Kubernetes > Register"], "a": [0], "e": "Select the target workspace, choose Add Cluster from the Actions menu, then Attach Cluster and the 'No additional networking restrictions' card. Provide the kubeconfig, select an admin context, add labels and Create.", "r": "Attaching a Cluster with No Networking Restrictions"}, {"id": "4.3-08", "obj": "4.3", "q": "How does a network-restricted cluster differ from an air-gapped cluster?", "o": ["A network-restricted cluster can reach external networks but its services can't be reached from outside; an air-gapped cluster allows neither ingress nor egress", "They are the same thing", "A network-restricted cluster has no Internet access at all", "An air-gapped cluster can be reached from outside but cannot reach out"], "a": [0], "e": "Network-restricted (firewalled/NAT/proxy) clusters can reach external networks such as the Internet, but their services or ingresses can't be accessed from outside. Air-gapped clusters allow no ingress or egress.", "r": "Network-Restricted Cluster"}, {"id": "4.3-09", "obj": "4.3", "q": "Which approach does NKP use to attach a cluster that sits behind a firewall or NAT and cannot be reached from the management cluster?", "o": ["A tunneled attachment: a tunnel agent on the remote cluster connects out to a TunnelGateway on the management cluster", "A site-to-site VPN created by NKP", "Exposing the remote API server publicly", "Copying etcd snapshots to the management cluster"], "a": [0], "e": "Network-restricted clusters are attached with a tunnel ('Cluster has networking restrictions'): a TunnelGateway listens on the management cluster and the remote cluster's agent connects to it.", "r": "Cluster Attachment with Networking Restrictions"}, {"id": "4.3-10", "obj": "4.3", "q": "Which two firewall rules are required for a tunneled attachment?", "o": ["Ingress on the management cluster network allowing HTTPS (TCP/443) and WebSocket to the NKP Traefik service", "Egress from the attached cluster nodes allowing HTTPS (TCP/443) and WebSocket to the management cluster's Traefik service", "Ingress on the attached cluster allowing TCP/6443 from the management cluster", "Egress from the management cluster to the attached cluster on TCP/22", "Ingress on Prism Central allowing TCP/9440 from the attached cluster"], "a": [0, 1], "e": "Tunneled attachment needs HTTPS (TCP/443) and WebSocket allowed inbound to the management cluster's Traefik and outbound from the attached/managed cluster nodes to it. No inbound access to the remote cluster is needed.", "r": "Prerequisites for a Tunneled Attachment"}, {"id": "4.3-11", "obj": "4.3", "q": "When attaching a network-restricted cluster through the UI, what is the default URL Path Prefix for the tunnel?", "o": ["`/nkp/tunnel`", "`/tunnel`", "`/kommander/attach`", "`/dex/tunnel`"], "a": [0], "e": "The URL path prefix defaults to /nkp/tunnel. Kommander provides default Traefik strip-prefix middleware only for that prefix; using another prefix requires managing your own middleware.", "r": "UI: Attaching a Network-Restricted Cluster Using a Tunnel Through the UI"}, {"id": "4.3-12", "obj": "4.3", "q": "What does enabling Proxied Access during a tunneled attachment provide?", "o": ["kubectl access and dashboard observability for the network-restricted cluster through the management cluster", "Internet access for the attached cluster", "Automatic Velero backups of the attached cluster", "An Ultimate license for the attached cluster"], "a": [0], "e": "Proxied access lets you reach the network-restricted cluster's kubectl API and dashboards via the management cluster without being on the same network. It uses a Cluster Proxy Domain and is restricted to DNS-based certificate solving.", "r": "UI: Attaching a Network-Restricted Cluster Using a Tunnel Through the UI"}, {"id": "4.3-13", "obj": "4.3", "q": "An attached cluster keeps dropping out of the NKP UI shortly after attachment. What does the documentation suggest checking?", "o": ["Whether the cluster has enough resources for the federated platform services (pods stuck without resources)", "Whether Prism Central is upgraded", "Whether the license is Starter", "Whether the bastion host is running"], "a": [0], "e": "If a cluster has limited resources to deploy all the federated platform services, it will fail to stay attached. Check for pods that aren't getting the resources they need.", "r": "Creating a kubeconfig File for Attachment"}, {"id": "4.3-14", "obj": "4.3", "q": "An administrator wants a platform application deployed with a custom configuration the moment a new cluster is attached, avoiding a redeploy afterwards. What should be done?", "o": ["Before attaching, add a `clusterConfigOverrides` entry for the future cluster name to the app's AppDeployment and create the ConfigMap on the management cluster", "Attach the cluster, then reinstall the application", "Edit the application's HelmRelease on the attached cluster", "Create the ConfigMap on the attached cluster after attaching"], "a": [0], "e": "Customize per cluster at attachment by referencing the to-be-attached cluster's name in `spec.clusterConfigOverrides` and creating the override ConfigMap on the management cluster first. This avoids downtime from redeploying.", "r": "Customizing an Application Per Cluster at Attachment"}, {"id": "4.3-15", "obj": "4.3", "q": "Attaching Kubernetes clusters with which version difference from NKP's version is not recommended?", "o": ["Versions greater than n-1 (more than one minor version newer)", "Any version older than NKP's", "Versions with a different patch number", "Any EKS version"], "a": [0], "e": "Attaching clusters with versions greater than n-1 is not recommended. Attaching a cluster with an older Kubernetes version than NKP's default requires building and using an image with that older version.", "r": "Supported Kubernetes Cluster Versions"}, {"id": "4.4-01", "obj": "4.4", "q": "What happens when an attached cluster (not created by Kommander) is detached?", "o": ["It is removed from the NKP UI, but its running state, workloads and platform services are not cleaned up", "The cluster and all of its cloud resources are deleted", "All workloads are drained and removed", "The cluster is converted to a managed cluster"], "a": [0], "e": "Detaching does not alter the cluster's running state; it simply removes it from the NKP UI. User workloads, platform services and other resources are not cleaned up.", "r": "Disconnecting or Deleting Clusters"}, {"id": "4.4-02", "obj": "4.4", "q": "After detaching an attached cluster, changes to apps in its former workspace still show up on it. What step was missed?", "o": ["Suspending the detached cluster's Flux GitRepository: `kubectl -n kommander-flux patch gitrepo management -p '{\"spec\":{\"suspend\":true}}' --type merge`", "Deleting the workspace", "Rotating the dashboard password", "Deleting the kommander namespace on the management cluster"], "a": [0], "e": "After detaching, manually disconnect the cluster's Flux installation from the management Git repository by suspending the `management` gitrepo in kommander-flux, so its workloads are no longer managed by Kommander.", "r": "Disconnecting or Deleting Clusters"}, {"id": "4.4-03", "obj": "4.4", "q": "Can a managed cluster that was created by Kommander be disconnected (detached) from NKP?", "o": ["No — it can only be deleted, which removes the cluster and all of its cloud assets", "Yes — the same way as any attached cluster", "Yes — but only from the CLI", "Only if it has no workloads"], "a": [0], "e": "Managed clusters created with Kommander cannot be disconnected; they can only be deleted, which completely removes the cluster and its infrastructure. Nutanix recommends deleting them through the NKP UI.", "r": "Disconnecting or Deleting Clusters"}, {"id": "4.4-04", "obj": "4.4", "q": "An administrator wants to tear down an entire NKP environment. In what order should clusters be deleted?", "o": ["Delete all managed clusters first, then delete the management cluster", "Delete the management cluster first; managed clusters are deleted automatically", "Order doesn't matter", "Delete the bootstrap cluster first"], "a": [0], "e": "If you delete the management (Konvoy) cluster first, you can no longer use Kommander to delete the managed clusters it created. Delete managed clusters before the management cluster.", "r": "Disconnecting or Deleting Clusters"}, {"id": "4.4-05", "obj": "4.4", "q": "A cluster is stuck in 'Pending' while detaching (or still shows 'Error' after being deleted from the CLI). Which two steps remove it from the NKP UI?", "o": ["Delete the KommanderCluster object in the workspace namespace", "If it doesn't go away, remove the KommanderCluster's finalizers with a JSON patch", "Delete the workspace", "Reinstall Kommander", "Delete the cluster's VMs in Prism Central"], "a": [0, 1], "e": "Find the KommanderCluster with `kubectl -n <workspace-ns> get kommandercluster`, delete it, and if it persists, patch it to remove `/metadata/finalizers`.", "r": "Disconnecting or Deleting Clusters"}, {"id": "4.4-06", "obj": "4.4", "q": "Which of these is listed as an unsupported operation in the NKP cluster limitations?", "o": ["Reconfiguring the IP address of the Prism Central VM", "Scaling node pools", "Upgrading Kommander", "Detaching attached clusters"], "a": [0], "e": "Cluster limitations: unregistering a cluster is not supported, reconfiguring the PC VM IP address is not supported, and deploying Objects on the cluster after changing the PC VM IP is not supported.", "r": "Cluster Limitations"}, {"id": "4.4-07", "obj": "4.4", "q": "Which cluster status indicates that Kubefed is cleaning up resources it installed on a cluster being disconnected?", "o": ["Unjoining", "Joining", "Provisioned", "Loading Data"], "a": [0], "e": "'Unjoining' means kubefed is removing the resources it installed on the target cluster; 'Unjoined' means it has been disconnected; 'Unjoin Failed' means the unjoin failed.", "r": "Cluster Statuses"}, {"id": "4.5-01", "obj": "4.5", "q": "What does NKP create when a project is created?", "o": ["A federated namespace that is propagated to the Kubernetes clusters associated with the project", "A new workspace", "A new management cluster", "A Prism Central project"], "a": [0], "e": "When a project is created, NKP creates a federated namespace (the project namespace) propagated, through KubeFed, to the clusters associated with the project.", "r": "Projects"}, {"id": "4.5-02", "obj": "4.5", "q": "What is the recommended way to choose which clusters belong to a project?", "o": ["Define labels so clusters are added dynamically, including clusters created or attached later", "Select clusters manually so membership never changes", "Add every cluster in Prism Central", "Use one project per cluster"], "a": [0], "e": "Clusters can be selected manually or by labels. Labels are recommended because clusters deployed later are associated automatically based on their labels.", "r": "Creating a Project Using the UI"}, {"id": "4.5-03", "obj": "4.5", "q": "If no namespace name is specified when creating a project, how is the project namespace named?", "o": ["Auto-generated from the project name (first 57 characters) plus 5 unique alphanumeric characters", "Exactly the project name", "project-<random 10 characters>", "The workspace name"], "a": [0], "e": "By default the namespace name is the project name (first 57 characters) plus 5 unique characters. A custom name must not conflict with existing namespaces on the target clusters.", "r": "Creating a Project Using the UI"}, {"id": "4.5-04", "obj": "4.5", "q": "Which Kubernetes resource defines a project declaratively, including the cluster label selector?", "o": ["`Project` (workspaces.kommander.mesosphere.io/v1alpha1) with `spec.workspaceRef` and `spec.placement.clusterSelector`", "`Namespace` with label `project=true`", "`FederatedNamespace` only", "`AppDeployment` with `kind: Project`"], "a": [0], "e": "A Project object references its workspace (`workspaceRef`), can set `namespaceName`, and uses `placement.clusterSelector.matchLabels` to choose clusters.", "r": "Creating a Project Using the CLI"}, {"id": "4.5-05", "obj": "4.5", "q": "Which two objects does NKP use to apply project quotas and limit ranges to all project clusters?", "o": ["A FederatedResourceQuota named `kommander` in the project namespace", "A FederatedLimitRange named `kommander` in the project namespace", "A Prism Central storage quota", "A PodDisruptionBudget per project", "A Gatekeeper ConstraintTemplate named quota"], "a": [0, 1], "e": "Project quotas use a FederatedResourceQuota named kommander and limit ranges use a FederatedLimitRange named kommander. They appear as a ResourceQuota/LimitRange in the project namespace on each project cluster.", "r": "Project Quotas and Limit Ranges"}, {"id": "4.5-06", "obj": "4.5", "q": "Which quotas does Nutanix recommend setting for a project?", "o": ["CPU and memory", "Only the number of pods", "Only storage", "No quotas"], "a": [0], "e": "Kommander provides default resources for quotas and supports custom ones; Nutanix recommends setting quotas for CPU and memory. Limit ranges constrain pods, containers and PVCs.", "r": "Project Quotas and Limit Ranges"}, {"id": "4.5-07", "obj": "4.5", "q": "A Project ConfigMap is created. What happens on the project's clusters?", "o": ["A Kubernetes ConfigMap is created automatically in the project namespace on every cluster in the project, via a FederatedConfigMap", "It is stored only on the management cluster", "It is sent to Prism Central", "It is injected into all namespaces on every cluster"], "a": [0], "e": "Project ConfigMaps are FederatedConfigMaps that create Kubernetes ConfigMaps in the project namespace on all associated clusters. Project Secrets work the same way via FederatedSecrets.", "r": "Project ConfigMaps"}, {"id": "4.5-08", "obj": "4.5", "q": "When a Project Role is created, what does Kommander create?", "o": ["A FederatedRole on the management cluster, which becomes a Kubernetes Role in the project namespace on each project cluster", "A ClusterRole on every cluster", "A Prism Central role", "A Dex connector"], "a": [0], "e": "Project Roles define namespace-level permissions. Kommander creates a FederatedRole on the management cluster, which is propagated as a Role in the project namespace on each project cluster.", "r": "Project Roles"}, {"id": "4.5-09", "obj": "4.5", "q": "Which resource binds a group of users to a Project Role from the CLI?", "o": ["`VirtualGroupProjectRoleBinding`", "`ClusterRoleBinding`", "`ProjectBinding`", "`FederatedUser`"], "a": [0], "e": "Project role bindings use `VirtualGroupProjectRoleBinding`, referencing either `projectRoleRef` or `workspaceRoleRef` (not both) and a `virtualGroupRef`. Kommander creates a FederatedRoleBinding that becomes a RoleBinding.", "r": "Project Role Bindings"}, {"id": "4.5-10", "obj": "4.5", "q": "What is a VirtualGroup in NKP access control?", "o": ["A list of subjects that can be bound to ClusterRoles, WorkspaceRoles or ProjectRoles", "A group of clusters in a project", "A Prism Central user group", "A Kubernetes namespace group"], "a": [0], "e": "A VirtualGroup is a list of subjects bound to roles with VirtualGroupClusterRoleBinding, VirtualGroupWorkspaceRoleBinding or VirtualGroupProjectRoleBinding. For workspace and project roles, the VirtualGroup, role and binding must be in the same namespace.", "r": "Role Binding with VirtualGroup"}, {"id": "4.5-11", "obj": "4.5", "q": "An administrator configures Continuous Deployment (GitOps) for a project. Which two statements are correct?", "o": ["Nutanix recommends creating a secret first, then a GitOps source that uses it", "Project deployments are backed by FluxCD", "The GitOps repository may contain cluster-scoped objects such as ClusterRoles", "A public GitHub repository always requires a secret", "Only one GitOps source is allowed per project"], "a": [0, 1], "e": "Create a secret, then a GitOps source in the project's Continuous Deployment tab; deployments are backed by FluxCD. Manifests must be namespace-scoped, public repos don't need a secret, and a project can have multiple GitOps sources.", "r": "Continuous Deployment"}, {"id": "4.5-12", "obj": "4.5", "q": "Which keys are required in a GitOps secret that uses SSH authentication?", "o": ["identity, identity.pub and known_hosts", "username and password", "username, password and caFile", "token and url"], "a": [0], "e": "SSH auth needs identity, identity.pub and known_hosts. HTTPS needs username and password (a GitHub token can go in password alone), and HTTPS with a self-signed certificate adds caFile.", "r": "Setting Up a Secret for Accessing GitOps"}, {"id": "4.5-13", "obj": "4.5", "q": "An SSH GitOps source fails because the repository URL uses the `git@github.com:org/repo.git` format. What is wrong?", "o": ["SCP-style syntax isn't supported; use `ssh://user@host:port/org/repository`", "SSH sources are not supported at all", "The URL must use http://", "The port must be 9440"], "a": [0], "e": "With an SSH secret, the repo URL must be an SSH address in the form ssh://user@host:port/org/repository; SCP syntax is not supported.", "r": "Creating the GitOps Source"}, {"id": "4.5-14", "obj": "4.5", "q": "During a production incident, an engineer must make live changes with kubectl without GitOps reverting them. What should be done?", "o": ["Suspend the GitOps source in the project's CD tab, fix the issue, then Resume", "Delete the GitOps source", "Delete the project namespace", "Disable Flux on the management cluster permanently"], "a": [0], "e": "Suspending stops auto-sync so you can use kubectl or helm; Resume then syncs the updated repository. Deleting the GitOps source removes all manifests it applied.", "r": "Suspending the GitOps Source"}, {"id": "4.5-15", "obj": "4.5", "q": "A project's GitOps deployment fails to sync. Which two repository contents are documented as causes?", "o": ["Cluster-scoped manifests such as Namespace, ClusterRole or ClusterRoleBinding", "HelmRelease or Kustomization resources that target a namespace other than the project namespace", "Deployments in the project namespace", "A README.md file", "Kustomize overlays within the project namespace"], "a": [0, 1], "e": "All GitOps manifests must be namespace-scoped, and HelmRelease/Kustomization resources must not target a different namespace than the project namespace.", "r": "Project Deployments Troubleshooting"}, {"id": "4.5-16", "obj": "4.5", "q": "Where do you check whether a project's GitOps manifests were synced from the management cluster side?", "o": ["Describe the GitopsRepository (`gitopsrepositories.dispatch.d2iq.io`) in the project namespace and look for a ManifestSyncSuccess event", "Check the Velero schedule", "Run `nkp get gitops --all`", "Look at Prism Central tasks"], "a": [0], "e": "On the management cluster, describe the GitopsRepository in the project namespace (ManifestSyncSuccess). On attached clusters, check the Flux Kustomization and GitRepository resources for Ready status.", "r": "Creating the GitOps Source"}, {"id": "4.5-17", "obj": "4.5", "q": "What network policy does a new NKP project start with?", "o": ["A secure-by-default network policy, which users can edit or extend", "No network policy; all traffic is allowed", "A policy that blocks all DNS", "A policy that only allows Prism Central traffic"], "a": [0], "e": "Projects are created with a secure-by-default network policy, and users can edit or add policies. Traffic between pods needs both egress on the source and ingress on the destination to be allowed.", "r": "Project Network Policies"}, {"id": "4.5-18", "obj": "4.5", "q": "Which platform applications can be enabled at the project level for multi-tenant logging?", "o": ["project-grafana-logging, project-grafana-loki and project-logging", "velero, kubecost and karma", "traefik, cert-manager and reloader", "dex, kubefed and gatekeeper"], "a": [0], "e": "Project platform applications are project-grafana-logging, project-grafana-loki and project-logging; none are deployed by default.", "r": "Project Platform Applications"}, {"id": "4.6-01", "obj": "4.6", "q": "Which command enables a platform application (for example Istio) for all clusters in a workspace from the CLI?", "o": ["`nkp create appdeployment istio --app istio-1.17.2 --workspace ${WORKSPACE_NAME}`", "`kubectl apply -f istio.yaml -n ${WORKSPACE_NAMESPACE}` on each cluster", "`nkp enable app istio`", "`helm install istio --namespace ${WORKSPACE_NAME}`"], "a": [0], "e": "Use `nkp create appdeployment <name> --app <APP-ID>-<version> --workspace <workspace NAME>`. The --app value must match an available app, and the command takes the workspace name, not the namespace.", "r": "Deploying Platform Applications Using CLI"}, {"id": "4.6-02", "obj": "4.6", "q": "An AppDeployment for a platform application references which kind of object?", "o": ["A ClusterApp (cluster-scoped, deployable to all workspaces and projects)", "An App (namespace-scoped)", "A HelmRepository", "A Deployment"], "a": [0], "e": "Platform application AppDeployments reference a ClusterApp. NKP catalog and custom applications reference an App, which is namespace-scoped and deployable only in the workspace or project where it was created.", "r": "AppDeployment Resources"}, {"id": "4.6-03", "obj": "4.6", "q": "How do you verify that a platform application deployed on an attached cluster?", "o": ["On the attached cluster, run `kubectl get helmreleases <app> -n ${WORKSPACE_NAMESPACE} -w` and confirm it is Ready", "Check the bastion's Docker images", "Run `nkp verify app`", "Check Prism Central alerts"], "a": [0], "e": "Connect to the attached cluster and watch the HelmRelease in the workspace namespace until it is Ready ('Release reconciliation succeeded').", "r": "Verifying the Deployed Platform Applications"}, {"id": "4.6-04", "obj": "4.6", "q": "Which two applications are 'foundational' platform applications that must be enabled for other platform applications to work on managed clusters?", "o": ["cert-manager", "traefik", "velero", "kubecost", "istio"], "a": [0, 1], "e": "The foundational applications are cert-manager, reloader and traefik (Traefik requires cert-manager and reloader).", "r": "Platform Applications Dependencies"}, {"id": "4.6-05", "obj": "4.6", "q": "An administrator enables grafana-logging, but it never becomes ready. According to the dependency table, what does grafana-logging require?", "o": ["grafana-loki, which in turn requires rook-ceph-cluster (which requires rook-ceph)", "kubecost", "velero", "istio"], "a": [0], "e": "grafana-logging requires grafana-loki; grafana-loki requires rook-ceph-cluster; rook-ceph-cluster requires rook-ceph. If a dependency fails to deploy, the dependent application also fails.", "r": "Platform Applications Dependencies"}, {"id": "4.6-06", "obj": "4.6", "q": "Which two dependency pairs are correct?", "o": ["prometheus-adapter requires kube-prometheus-stack", "velero requires rook-ceph-cluster", "kube-prometheus-stack requires velero", "traefik requires kubecost", "istio requires grafana-loki"], "a": [0, 1], "e": "prometheus-adapter depends on kube-prometheus-stack and velero on rook-ceph-cluster. Istio depends on kube-prometheus-stack; jaeger, kiali and knative depend on istio.", "r": "Platform Applications Dependencies"}, {"id": "4.6-07", "obj": "4.6", "q": "Which two workspace platform applications are NOT deployed by default when a cluster is attached?", "o": ["velero", "grafana-loki", "kube-prometheus-stack", "traefik", "cert-manager"], "a": [0, 1], "e": "On attached clusters, cert-manager, gatekeeper, kube-prometheus-stack, kubecost, kubernetes-dashboard, prometheus-adapter, reloader, rook-ceph, rook-ceph-cluster, traefik and traefik-forward-auth deploy by default. Velero, the logging apps, Istio, Jaeger, Kiali, Knative, External DNS and the NVIDIA GPU operator do not.", "r": "Workspace Platform Application Defaults and Resource Requirements"}, {"id": "4.6-08", "obj": "4.6", "q": "Which two statements about platform application instances per cluster are correct?", "o": ["Only a single cert-manager deployment per cluster is supported", "Only a single Traefik deployment per cluster is supported", "Multiple Traefik instances per cluster are recommended for HA", "cert-manager must be installed manually on every Konvoy cluster", "traefik-forward-auth must be enabled manually in the UI"], "a": [0, 1], "e": "NKP supports only one cert-manager and one Traefik per cluster. NKP manages traefik-forward-auth and kube-oidc-proxy automatically on attachment; they aren't shown in the UI.", "r": "Workspace Platform Application Defaults and Resource Requirements"}, {"id": "4.6-09", "obj": "4.6", "q": "An application is enabled at the workspace level. What happens when a new cluster is later created in or attached to that workspace?", "o": ["The application is automatically enabled and deployed on the new cluster", "Nothing; it must be enabled again per cluster", "The application is disabled for all clusters", "Only catalog applications are deployed automatically"], "a": [0], "e": "Enabling an app for a workspace deploys it to all clusters in the workspace, and NKP automatically enables it on any cluster created or attached later.", "r": "Workspace Applications"}, {"id": "4.6-10", "obj": "4.6", "q": "An NKP Ultimate administrator wants kube-prometheus-stack on only two of five clusters in a workspace. How is this done from the CLI?", "o": ["`nkp create appdeployment kube-prometheus-stack --app <version> --workspace ${WORKSPACE_NAME} --clusters cluster1,cluster2` (populating spec.clusterSelector)", "Create five workspaces", "Delete the HelmRelease on the other three clusters", "It isn't possible; workspace apps always go to all clusters"], "a": [0], "e": "Cluster-scoped enablement (Ultimate only) uses `--clusters`, which populates the AppDeployment's `spec.clusterSelector` (key kommander.d2iq.io/cluster-name). Clusters can be added to or removed from the selector later.", "r": "Cluster-scoped Application for Existing AppDeployments"}, {"id": "4.6-11", "obj": "4.6", "q": "Which two statements about per-cluster application overrides (clusterConfigOverrides) are correct?", "o": ["Override ConfigMaps must be created on the management cluster", "Only one cluster override ConfigMap per cluster is applied", "Override ConfigMaps must be created on each attached cluster", "Per-cluster overrides are available for project applications", "Per-cluster overrides are available with NKP Pro for all clusters"], "a": [0, 1], "e": "clusterConfigOverrides reference ConfigMaps that must exist on the management cluster; if several are configured for one cluster, only one is applied. Cluster-scoped customization is Ultimate-only and not available for project applications.", "r": "Cluster-scoped Application for Existing AppDeployments"}, {"id": "4.6-12", "obj": "4.6", "q": "In the UI's application Configuration tab, how do the workspace configuration and the cluster configuration override interact?", "o": ["The cluster override merges with the workspace configuration; without a cluster override, the workspace configuration applies", "The cluster override replaces the workspace configuration entirely", "The workspace configuration is ignored once any override exists", "They cannot both be set"], "a": [0], "e": "Cluster Application Configuration Overrides merge with the Workspace Application Configuration. If there is no cluster-scoped configuration, the workspace configuration applies.", "r": "Workspace Applications"}, {"id": "4.6-13", "obj": "4.6", "q": "Which command shows which clusters a workspace's AppDeployments are deployed to?", "o": ["`nkp get appdeployments -w <workspace>`", "`kubectl get pods -A`", "`nkp describe apps --clusters`", "`helm list -A`"], "a": [0], "e": "`nkp get appdeployments -w <workspace>` prints each app, its version and the clusters it targets; `nkp get appdeployment <app> -w <workspace>` shows one app.", "r": "Printing and Reviewing the Current State of an AppDeployment Resource"}, {"id": "4.6-14", "obj": "4.6", "q": "An administrator references a ConfigMap in an AppDeployment's configOverrides but hasn't created it yet. What does Kommander do?", "o": ["It waits for the ConfigMap to be present before deploying the AppDeployment to the clusters", "It deploys with default values and ignores the reference", "It deletes the AppDeployment", "It creates an empty ConfigMap automatically"], "a": [0], "e": "Kommander waits for the referenced ConfigMap to exist before deploying the AppDeployment to the managed or attached clusters. A ConfigMap actively referenced by configOverrides cannot be deleted.", "r": "Custom Application from the Workspace Catalog"}, {"id": "4.6-15", "obj": "4.6", "q": "How are platform applications versioned and upgraded compared with catalog applications?", "o": ["Platform apps come as a tested bundle deployed/upgraded together per workspace; catalog apps are individual and can be deployed and upgraded per project", "Both are upgraded individually per cluster", "Catalog apps are bundled; platform apps are individual", "Neither can be upgraded"], "a": [0], "e": "Platform applications are a bundle tested as a unit, so all clusters in a workspace have the same set and versions. Catalog applications are individual and can be deployed and upgraded per project.", "r": "Project Applications"}, {"id": "4.6-16", "obj": "4.6", "q": "Which label marks a Flux GitRepository in a workspace namespace as an NKP application catalog?", "o": ["`kommander.d2iq.io/gitrepository-type: catalog` (with `kommander.d2iq.io/gitapps-gitrepository-type: nkp` for the NKP catalog)", "`catalog.nutanix.com/enabled: true`", "`app.kubernetes.io/part-of: catalog`", "`kommander.d2iq.io/project-default: true` only"], "a": [0], "e": "The catalog GitRepository carries `kommander.d2iq.io/gitrepository-type: catalog` (and gitapps type nkp for the NKP catalog). Its apps then appear in `kubectl get apps -n ${WORKSPACE_NAMESPACE}` and in the UI.", "r": "Installing the NKP Catalog Application Using the CLI"}, {"id": "4.6-17", "obj": "4.6", "q": "Which CLI command adds a Git-based application catalog to a workspace?", "o": ["`nkp create catalog <name> -w <workspace> --url <git-repo-url> --branch main`", "`nkp add repo <url>`", "`helm repo add <name> <url>`", "`kubectl create catalog <name>`"], "a": [0], "e": "`nkp create catalog` creates a catalog GitRepository on the management cluster for the given workspace; check it with `kubectl get gitRepository -A`.", "r": "Creating an NKP Catalog using the CLI"}, {"id": "4.6-18", "obj": "4.6", "q": "For custom applications in a catalog Git repository, where is the metadata file that controls how an app appears in the NKP UI?", "o": ["`services/<application>/metadata.yaml`", "`charts/metadata.json`", "`.nkp/app.yaml` at the repository root", "`README.md`"], "a": [0], "e": "Define `services/<application>/metadata.yaml` with optional fields displayName, description, category, overview, icon (base64 SVG) and scope (project or workspace; default project).", "r": "Workspace Application Metadata"}, {"id": "4.6-19", "obj": "4.6", "q": "Which catalog applications are supported in the NKP 2.12 workspace catalog?", "o": ["Kafka operator and ZooKeeper operator", "Spark and Cassandra", "Jenkins and GitLab", "MySQL and PostgreSQL"], "a": [0], "e": "In NKP 2.12, the supported catalog apps are kafka-operator and zookeeper-operator; earlier catalog applications are deprecated. Install the Kafka operator only once per workspace.", "r": "Workplace Catalog Applications"}, {"id": "4.6-20", "obj": "4.6", "q": "Which Kommander object is created for each enabled platform application during installation?", "o": ["An AppDeployment", "A Deployment named after the app", "A Workspace", "A Project"], "a": [0], "e": "When NKP is installed, an AppDeployment is created for each enabled platform application. It references a ClusterApp that points to the app's declarative configuration, usually a HelmRelease.", "r": "AppDeployment Resources"}];

/* ---------- utils ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(s){ return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
function sameSet(a,b){ if(a.length!==b.length) return false; const s=new Set(a); return b.every(x=>s.has(x)); }
function $(sel, root){ return (root||document).querySelector(sel); }
let toastT=null;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1300); }
function hint(q){ return q.a.length>1 ? "Choose "+(WORD[q.a.length]||q.a.length)+"." : "Choose one."; }
function inScope(q, scope){ return scope==="all" || (scope.length===1 ? q.obj.charAt(0)===scope : q.obj===scope); }
function recordResult(id, correct){
  const s = store.stats[id] || {n:0,c:0,last:null};
  s.n++; if(correct) s.c++; s.last = correct?1:0; store.stats[id]=s;
}

/* ---------- shared question card ---------- */
function cardHTML(q, perm, sel, reveal, idx, total){
  const sec = q.obj.charAt(0);
  let h = '<article class="qcard">';
  h += '<div class="qmeta"><span class="tag">'+esc(q.obj)+'</span><span class="objname">'+esc(OBJ[q.obj]||SEC[sec])+'</span></div>';
  h += '<h2 class="qtext">'+fmt(q.q)+'</h2>';
  h += '<p class="qhint'+(q.a.length>1?' multi':'')+'">'+hint(q)+'</p>';
  h += '<ol class="opts">';
  perm.forEach((oi, k) => {
    const picked = sel.indexOf(oi) >= 0, right = q.a.indexOf(oi) >= 0;
    let cls = "opt", mark = "";
    if (reveal){
      if (right && picked){ cls += " ok"; mark = "✓"; }
      else if (right){ cls += " missed"; mark = "✓"; }
      else if (picked){ cls += " bad"; mark = "✕"; }
    }
    h += '<li><button class="'+cls+'" data-i="'+oi+'" aria-pressed="'+(picked && !reveal ? "true":"false")+'"'+(reveal?' disabled':'')+'>'
      + '<span class="key">'+LETTERS[k]+'</span><span class="otext">'+fmt(q.o[oi])+'</span><span class="mark" aria-hidden="true">'+mark+'</span></button></li>';
  });
  h += '</ol>';
  if (reveal){
    const ok = sameSet(sel, q.a);
    const letters = perm.map((oi,k)=> q.a.indexOf(oi)>=0 ? LETTERS[k] : null).filter(Boolean).join(", ");
    h += '<section class="explain '+(ok?'ok':'bad')+'"><div class="verdict">'+(ok ? "Correct" : (sel.length? "Not quite. Correct answer: "+letters : "Unanswered. Correct answer: "+letters))+'</div>'
      + '<p>'+fmt(q.e)+'</p><div class="ref">Source: '+esc(q.r)+' · NKP 2.12 Guide</div></section>';
  }
  h += '</article>';
  return h;
}

/* ---------- PRACTICE ---------- */
const P = {order:[], pos:0, sel:[], checked:false, perm:[]};
function pool(){
  let ids = BANK.filter(q => inScope(q, store.prefs.scope)).map(q=>q.id);
  if (store.prefs.missed) ids = ids.filter(id => store.stats[id] && store.stats[id].last === 0);
  return ids;
}
function buildPractice(doShuffle){
  P.order = pool(); if (doShuffle) shuffle(P.order);
  P.pos = 0; resetQ();
}
function resetQ(){ P.sel=[]; P.checked=false; const q = BY_ID[P.order[P.pos]]; P.perm = q ? shuffle(q.o.map((_,i)=>i)) : []; }

function scopeOptions(){
  const counts = {}; BANK.forEach(q => { counts[q.obj]=(counts[q.obj]||0)+1; counts[q.obj[0]]=(counts[q.obj[0]]||0)+1; });
  let h = '<option value="all">All objectives ('+BANK.length+')</option>';
  Object.keys(SEC).forEach(s => {
    h += '<optgroup label="Section '+s+' · '+esc(SEC[s])+'">';
    h += '<option value="'+s+'">All of section '+s+' ('+(counts[s]||0)+')</option>';
    Object.keys(OBJ).filter(o=>o[0]===s).forEach(o => { h += '<option value="'+o+'">'+o+' '+esc(OBJ[o])+' ('+(counts[o]||0)+')</option>'; });
    h += '</optgroup>';
  });
  return h;
}

function renderPractice(){
  const ids = BANK.filter(q => inScope(q, store.prefs.scope)).map(q=>q.id);
  let ok=0, bad=0; ids.forEach(id => { const s=store.stats[id]; if(s){ if(s.last===1) ok++; else if(s.last===0) bad++; } });
  const pct = n => ids.length ? (100*n/ids.length).toFixed(1) : 0;
  const q = BY_ID[P.order[P.pos]];
  const need = q ? q.a.length : 1;
  let h = '';
  h += '<div class="toolbar"><select class="select" id="scope" aria-label="Objective filter">'+scopeOptions()+'</select>'
     + '<button class="chip" id="missed" aria-pressed="'+(store.prefs.missed?"true":"false")+'">Missed</button>'
     + '<button class="icon-btn" id="shuf" aria-label="Shuffle questions" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>'
     + '<button class="icon-btn" id="reset" aria-label="Reset progress" title="Reset progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button></div>';
  h += '<div class="stats"><div class="bar"><i class="b-ok" style="width:'+pct(ok)+'%"></i><i class="b-bad" style="width:'+pct(bad)+'%"></i></div>'
     + '<div class="statline"><span>'+ids.length+' questions in scope</span><span><span class="ok">'+ok+' right</span> · <span class="bad">'+bad+' missed</span> · '+(ids.length-ok-bad)+' new</span></div></div>';
  h += '<main class="content" id="content">';
  if (!q){
    h += '<div class="empty">'+(store.prefs.missed ? 'No missed questions in this scope. Turn off “Missed” to keep practicing.' : 'No questions in this scope.')+'</div>';
  } else {
    h += cardHTML(q, P.perm, P.sel, P.checked);
    h += '<p class="note">Original practice questions written from the official NKP 2.12 documentation in the NCP-CN exam format. Unofficial — not affiliated with Nutanix and not actual exam content.</p>';
  }
  h += '</main>';
  const canCheck = q && (need>1 ? P.sel.length===need : P.sel.length===1);
  h += '<footer class="actions"><button class="btn nav" id="prev" aria-label="Previous question"'+(q?'':' disabled')+'>←</button>'
     + '<span class="counter">'+(q ? (P.pos+1)+' / '+P.order.length : '0 / 0')+'</span>'
     + (P.checked ? '<button class="btn primary" id="next">Next question</button>' : '<button class="btn primary" id="check"'+(canCheck?'':' disabled')+'>'+(q && need>1 && P.sel.length<need ? 'Select '+need : 'Check answer')+'</button>')
     + '<button class="btn nav" id="fwd" aria-label="Next question"'+(q?'':' disabled')+'>→</button></footer>';
  const v = $("#view"); v.innerHTML = h;
  $("#scope").value = store.prefs.scope;
  $("#scope").onchange = e => { store.prefs.scope = e.target.value; save(); buildPractice(false); renderPractice(); };
  $("#missed").onclick = () => { store.prefs.missed = !store.prefs.missed; save(); buildPractice(false); renderPractice(); };
  $("#shuf").onclick = () => { buildPractice(true); renderPractice(); toast("Shuffled"); };
  $("#reset").onclick = () => confirmSheet("Reset practice progress?", "This clears your right/missed history for every question. Mock exam history is kept.", "Reset", () => { store.stats = {}; save(); buildPractice(false); renderPractice(); toast("Progress reset"); });
  if (!q) return;
  v.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.i));
  if ($("#check")) $("#check").onclick = check;
  if ($("#next")) $("#next").onclick = () => step(1);
  $("#prev").onclick = () => step(-1);
  $("#fwd").onclick = () => step(1);
  swipe($("#content"), () => step(1), () => step(-1));
}
function pick(i){
  if (P.checked) return;
  const q = BY_ID[P.order[P.pos]];
  const at = P.sel.indexOf(i);
  if (q.a.length === 1){ P.sel = [i]; }
  else if (at >= 0){ P.sel.splice(at,1); }
  else if (P.sel.length < q.a.length){ P.sel.push(i); }
  else { toast("Choose "+(WORD[q.a.length]||q.a.length)+" — deselect one first"); return; }
  renderPractice();
}
function check(){
  const q = BY_ID[P.order[P.pos]];
  if (!q || P.checked) return;
  if (P.sel.length !== q.a.length) return;
  P.checked = true;
  recordResult(q.id, sameSet(P.sel, q.a)); save();
  renderPractice();
  const ex = $(".explain"); if (ex) ex.scrollIntoView({block:"nearest", behavior:"smooth"});
}
function step(d){
  if (!P.order.length) return;
  if (store.prefs.missed && P.checked){ // drop questions answered correctly from the missed queue
    const id = P.order[P.pos];
    if (store.stats[id] && store.stats[id].last === 1){ P.order.splice(P.pos,1); if (d>0) d=0; if (!P.order.length){ resetQ(); renderPractice(); return; } }
  }
  P.pos = (P.pos + d + P.order.length) % P.order.length;
  resetQ(); renderPractice();
  const c = $("#content"); if (c) c.scrollTop = 0;
}

/* ---------- swipe ---------- */
function swipe(el, onLeft, onRight){
  if (!el) return;
  let x0=null, y0=null;
  el.addEventListener("touchstart", e => { if(e.touches.length!==1) return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; }, {passive:true});
  el.addEventListener("touchend", e => {
    if (x0===null) return;
    const t = e.changedTouches[0], dx = t.clientX-x0, dy = t.clientY-y0; x0=y0=null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > 2*Math.abs(dy)){ dx < 0 ? onLeft() : onRight(); }
  }, {passive:true});
}

/* ---------- MOCK EXAM ---------- */
let tick = null;
function sample(n){
  const groups = {}; BANK.forEach(q => (groups[q.obj] = groups[q.obj] || []).push(q.id));
  const alloc = Object.keys(groups).map(k => { const exact = n*groups[k].length/BANK.length; return {k, exact, take:Math.floor(exact)}; });
  let rem = n - alloc.reduce((s,a)=>s+a.take,0);
  alloc.sort((a,b)=> (b.exact-b.take)-(a.exact-a.take) || Math.random()-0.5);
  for (let i=0; rem>0; i++, rem--) alloc[i % alloc.length].take++;
  const ids = []; alloc.forEach(a => ids.push.apply(ids, shuffle(groups[a.k].slice()).slice(0, a.take)));
  return shuffle(ids);
}
function startExam(){
  const ids = sample(EXAM_N), perm = {};
  ids.forEach(id => perm[id] = shuffle(BY_ID[id].o.map((_,i)=>i)));
  store.exam = {ids, ans:{}, flag:{}, perm, pos:0, start:Date.now(), dur:EXAM_MIN*60000, done:false, result:null};
  save(); renderExam();
}
function remaining(){ const e=store.exam; return Math.max(0, e.start + e.dur - Date.now()); }
function clock(ms){ const s=Math.ceil(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"); }
function submitExam(auto){
  const e = store.exam; if (!e || e.done) return;
  let correct = 0; const bySec = {}, byObj = {};
  e.ids.forEach(id => {
    const q = BY_ID[id], a = e.ans[id] || [], ok = sameSet(a, q.a);
    const s = q.obj[0];
    bySec[s] = bySec[s] || {c:0,t:0}; bySec[s].t++; if (ok) bySec[s].c++;
    byObj[q.obj] = byObj[q.obj] || {c:0,t:0}; byObj[q.obj].t++; if (ok) byObj[q.obj].c++;
    if (ok) correct++;
    if (a.length) recordResult(id, ok);
  });
  e.done = true;
  e.result = {correct, total:e.ids.length, bySec, byObj, used: Math.min(Date.now()-e.start, e.dur), auto:!!auto};
  store.history = (store.history || []).concat([{at:Date.now(), correct, total:e.ids.length}]).slice(-12);
  save(); clearInterval(tick); tick=null;
  renderExam();
  if (auto) toast("Time is up — exam submitted");
}
function renderExam(){
  clearInterval(tick); tick=null;
  const e = store.exam;
  if (e && !e.done && remaining() <= 0){ submitExam(true); return; }
  if (!e) return renderExamStart();
  if (e.done) return renderResults();
  const id = e.ids[e.pos], q = BY_ID[id], sel = e.ans[id] || [];
  const answered = Object.keys(e.ans).filter(k => (e.ans[k]||[]).length).length;
  let h = '<div class="examhead"><span class="timer" id="timer">'+clock(remaining())+'</span>'
        + '<div class="right"><button class="btn" id="grid" style="padding:8px 12px">'+answered+'/'+e.ids.length+' answered</button>'
        + '<button class="btn" id="submit" style="padding:8px 12px">Submit</button></div></div>';
  h += '<main class="content" id="content">'+cardHTML(q, e.perm[id], sel, false)+'</main>';
  h += '<footer class="actions"><button class="btn nav" id="prev" aria-label="Previous question">←</button>'
     + '<span class="counter">'+(e.pos+1)+' / '+e.ids.length+'</span>'
     + '<button class="btn flag" id="flag" aria-pressed="'+(e.flag[id]?"true":"false")+'" style="flex:1 1 auto">'+(e.flag[id]?'Flagged':'Flag for review')+'</button>'
     + '<button class="btn primary" id="next" style="flex:0 0 auto;padding:12px 18px">'+(e.pos===e.ids.length-1?'Review':'Next')+'</button></footer>';
  const v = $("#view"); v.innerHTML = h;
  v.querySelectorAll(".opt").forEach(b => b.onclick = () => examPick(+b.dataset.i));
  $("#prev").onclick = () => examGo(e.pos-1);
  $("#next").onclick = () => e.pos===e.ids.length-1 ? openGrid() : examGo(e.pos+1);
  $("#flag").onclick = () => { e.flag[id] = !e.flag[id]; save(); renderExam(); };
  $("#grid").onclick = openGrid;
  $("#submit").onclick = askSubmit;
  swipe($("#content"), () => examGo(e.pos+1), () => examGo(e.pos-1));
  tick = setInterval(() => {
    const r = remaining(), t = $("#timer");
    if (r <= 0){ submitExam(true); return; }
    if (t){ t.textContent = clock(r); t.classList.toggle("low", r < 10*60000); }
  }, 1000);
  const t = $("#timer"); if (t) t.classList.toggle("low", remaining() < 10*60000);
}
function examPick(i){
  const e = store.exam, id = e.ids[e.pos], q = BY_ID[id];
  const sel = (e.ans[id] || []).slice(), at = sel.indexOf(i);
  if (q.a.length === 1){ e.ans[id] = at>=0 ? [] : [i]; }
  else if (at >= 0){ sel.splice(at,1); e.ans[id] = sel; }
  else if (sel.length < q.a.length){ sel.push(i); e.ans[id] = sel; }
  else { toast("Choose "+(WORD[q.a.length]||q.a.length)+" — deselect one first"); return; }
  save(); renderExam();
}
function examGo(p){
  const e = store.exam; if (p < 0 || p >= e.ids.length) return;
  e.pos = p; save(); renderExam(); const c=$("#content"); if(c) c.scrollTop=0;
}
function openGrid(){
  const e = store.exam;
  let h = '<h3>Questions</h3><div class="grid">';
  e.ids.forEach((id, k) => {
    const cls = [(e.ans[id]||[]).length ? "ans":"", e.flag[id] ? "flg":"", k===e.pos ? "cur":""].join(" ");
    h += '<button class="'+cls+'" data-k="'+k+'" aria-label="Question '+(k+1)+'">'+(k+1)+'</button>';
  });
  h += '</div><div class="legend"><span>■ answered</span><span style="color:var(--flag)">● flagged</span><span>□ unanswered</span></div>'
     + '<div class="btnrow"><button class="btn" id="gclose">Back to question</button><button class="btn primary" id="gsubmit">Submit exam</button></div>';
  const s = sheet(h);
  s.querySelectorAll(".grid button").forEach(b => b.onclick = () => { closeSheet(); examGo(+b.dataset.k); });
  $("#gclose", s).onclick = closeSheet;
  $("#gsubmit", s).onclick = () => { closeSheet(); askSubmit(); };
}
function askSubmit(){
  const e = store.exam;
  const un = e.ids.filter(id => !(e.ans[id]||[]).length).length;
  const fl = e.ids.filter(id => e.flag[id]).length;
  confirmSheet("Submit the exam?", (un ? un+" unanswered (scored as incorrect). " : "All questions answered. ") + (fl ? fl+" flagged for review." : ""), "Submit", () => submitExam(false));
}
function renderExamStart(){
  const hist = (store.history||[]).slice().reverse();
  let h = '<main class="content" id="content"><section class="panel">'
    + '<h2>Mock exam</h2><p>Mirrors the NCP-CN format: '+EXAM_N+' questions in '+EXAM_MIN+' minutes, a mix of single-answer and “choose two” questions drawn across all four blueprint sections. No feedback until you submit.</p>'
    + '<div class="facts"><div class="fact"><b>'+EXAM_N+'</b><span>questions</span></div><div class="fact"><b>'+EXAM_MIN+'</b><span>minutes</span></div><div class="fact"><b>'+BANK.length+'</b><span>in the bank</span></div></div>'
    + '<p>The real exam reports a scaled score (1000–6000, pass at 3000), so the percentage here is a readiness signal, not a predicted score. Progress saves automatically — you can leave and come back.</p>'
    + '<div class="btnrow"><button class="btn primary" id="begin">Start exam</button></div>';
  if (hist.length){
    h += '<div class="hist">Recent attempts<br>' + hist.map(x => new Date(x.at).toLocaleDateString(undefined,{month:"short",day:"numeric"})+' · '+x.correct+'/'+x.total+' · '+Math.round(100*x.correct/x.total)+'%').join("<br>") + '</div>';
  }
  h += '</section></main>';
  $("#view").innerHTML = h;
  $("#begin").onclick = startExam;
}
function renderResults(){
  const e = store.exam, r = e.result, pct = Math.round(100*r.correct/r.total);
  let h = '<main class="content" id="content"><section class="panel">'
    + '<h2>'+(r.auto?'Time is up':'Exam submitted')+'</h2>'
    + '<div class="score"><b>'+pct+'%</b><span>'+r.correct+' of '+r.total+' correct · '+clock(r.used)+' used</span></div>';
  Object.keys(SEC).forEach(s => {
    const x = r.bySec[s]; if (!x) return;
    const p = Math.round(100*x.c/x.t);
    h += '<div class="secrow"><div class="lbl"><span>'+s+' · '+esc(SEC[s])+'</span><span>'+x.c+'/'+x.t+'</span></div>'
       + '<div class="bar"><i class="b-ok" style="width:'+p+'%"></i><i class="b-bad" style="width:'+(100-p)+'%"></i></div></div>';
  });
  const weak = Object.keys(r.byObj).map(o => ({o, p:r.byObj[o].c/r.byObj[o].t, t:r.byObj[o].t})).filter(x => x.p < 0.7).sort((a,b)=>a.p-b.p).slice(0,4);
  if (weak.length) h += '<p style="margin-top:14px">Weakest objectives: '+weak.map(w => '<code>'+w.o+'</code> '+esc(OBJ[w.o])).join(" · ")+'</p>';
  h += '<div class="btnrow"><button class="btn" id="rev">Review missed</button><button class="btn" id="revall">Review all</button><button class="btn primary" id="again">New exam</button></div>'
    + '<div class="btnrow" style="margin-top:8px"><button class="btn" id="drill">Practice missed questions</button></div>'
    + '</section><div class="review" id="review"></div></main>';
  $("#view").innerHTML = h;
  const showReview = onlyMissed => {
    const list = e.ids.filter(id => !onlyMissed || !sameSet(e.ans[id]||[], BY_ID[id].a));
    $("#review").innerHTML = list.length ? list.map(id => cardHTML(BY_ID[id], e.perm[id], e.ans[id]||[], true)).join("") : '<div class="empty">Nothing missed — every answer was correct.</div>';
    $("#review").scrollIntoView({behavior:"smooth", block:"start"});
  };
  $("#rev").onclick = () => showReview(true);
  $("#revall").onclick = () => showReview(false);
  $("#again").onclick = () => { store.exam = null; save(); startExam(); };
  $("#drill").onclick = () => { store.prefs.missed = true; store.prefs.scope = "all"; save(); setMode("practice"); buildPractice(true); renderPractice(); };
}

/* ---------- sheets ---------- */
function sheet(inner){
  closeSheet();
  const s = document.createElement("div"); s.className="scrim"; s.id="scrim";
  s.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">'+inner+'</div>';
  s.addEventListener("click", ev => { if (ev.target === s) closeSheet(); });
  document.body.appendChild(s);
  return s;
}
function closeSheet(){ const s=$("#scrim"); if (s) s.remove(); }
function confirmSheet(title, body, okLabel, onOk){
  const s = sheet('<h3>'+esc(title)+'</h3><p style="margin:0 0 6px;color:var(--muted);font-size:.9rem;line-height:1.5">'+esc(body)+'</p>'
    + '<div class="btnrow"><button class="btn" id="cno">Cancel</button><button class="btn primary" id="cyes">'+esc(okLabel)+'</button></div>');
  $("#cno", s).onclick = closeSheet;
  $("#cyes", s).onclick = () => { closeSheet(); onOk(); };
}

/* ---------- modes & keys ---------- */
let mode = "practice";
function setMode(m){
  mode = m;
  $("#modePractice").setAttribute("aria-pressed", m==="practice");
  $("#modeExam").setAttribute("aria-pressed", m==="exam");
  closeSheet();
  if (m === "practice"){ clearInterval(tick); tick=null; renderPractice(); }
  else renderExam();
}
$("#modePractice").onclick = () => setMode("practice");
$("#modeExam").onclick = () => setMode("exam");
document.addEventListener("keydown", ev => {
  if ($("#scrim")) { if (ev.key === "Escape") closeSheet(); return; }
  if (ev.target && ev.target.tagName === "SELECT") return;
  const k = ev.key.toLowerCase();
  const idx = "abcdef".indexOf(k) >= 0 ? "abcdef".indexOf(k) : ("123456".indexOf(k) >= 0 ? "123456".indexOf(k) : -1);
  if (mode === "practice"){
    const q = BY_ID[P.order[P.pos]]; if (!q) return;
    if (idx >= 0 && idx < P.perm.length){ pick(P.perm[idx]); }
    else if (k === "enter"){ P.checked ? step(1) : check(); }
    else if (k === "arrowright"){ step(1); } else if (k === "arrowleft"){ step(-1); }
  } else if (store.exam && !store.exam.done){
    const e = store.exam, id = e.ids[e.pos];
    if (idx >= 0 && idx < e.perm[id].length){ examPick(e.perm[id][idx]); }
    else if (k === "arrowright" || k === "enter"){ examGo(e.pos+1); } else if (k === "arrowleft"){ examGo(e.pos-1); }
    else if (k === "f"){ e.flag[id] = !e.flag[id]; save(); renderExam(); }
  }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && mode === "exam") renderExam(); });

/* ---------- boot ---------- */
