file and `--kubeconfig` to make sure Kommander is installed on the correct cluster.", "r": "Installing Kommander with a Configuration File"}, {"id": "2.2-03", "obj": "2.2", "q": "An administrator installs Kommander with an NKP Pro license in an air-gapped environment. Which two flags must point to files from the air-gapped bundle?", "o": ["`--kommander-applications-repository ./application-repositories/kommander-applications-v2.12.0.tar.gz`", "`--charts-bundle ./application-charts/nkp-kommander-charts-bundle-v2.12.0.tar.gz`", "`--bundle ./container-images/konvoy-image-bundle-v2.12.0.tar`", "`--artifacts-directory ./kib/artifacts`", "`--registry-mirror-url`"], "a": [0, 1], "e": "Air-gapped Kommander installs add `--kommander-applications-repository` and `--charts-bundle`. With Ultimate catalog apps, a second `--charts-bundle` points to the catalog applications charts bundle.", "r": "Installing Kommander in an Air-gapped Environment"}, {"id": "2.2-04", "obj": "2.2", "q": "With an NKP Ultimate license, how are the NKP catalog applications enabled during Kommander installation?", "o": ["Add a `catalog.repositories` entry for `dkp-catalog-applications` to kommander.yaml, then run `nkp install kommander --installer-config`", "Run `nkp enable catalog` after installation", "Catalog applications are always enabled by default", "Add `--enable-catalog` to `nkp create cluster`"], "a": [0], "e": "Add the `dkp-catalog-applications` repository (with the default-catalog-repository labels and a gitRepositorySpec, or a local tarball path when air-gapped) under `catalog.repositories` in kommander.yaml and install with it.", "r": "Ultimate License: Installing Kommander in Non-Air-gapped with NKP Catalog Applications"}, {"id": "2.2-05", "obj": "2.2", "q": "The Kommander installation keeps timing out because applications take a long time to deploy. What should the administrator do?", "o": ["Add `--wait-timeout 1h` (or another period) to `nkp install kommander`", "Add `--wait=false` and delete pending HelmReleases", "Reduce the number of control plane nodes", "Reinstall the cluster with more control plane replicas"], "a": [0], "e": "Add the `--wait-timeout <time>` flag (for example 1h) to allocate more time. If installation fails, rerun the install command to retry.", "r": "Installing Kommander in a Non-Air-gapped Environment"}, {"id": "2.2-06", "obj": "2.2", "q": "The Kommander installation failed partway through. What is the documented way to retry it?", "o": ["Rerun the same `nkp install kommander` command", "Delete the cluster and create a new one", "Delete the kommander namespace, then reinstall", "Run `nkp repair kommander`"], "a": [0], "e": "If the Kommander installation fails, or you want to reconfigure applications, rerun the install command to retry.", "r": "Verifying Kommander Installation"}, {"id": "2.2-07", "obj": "2.2", "q": "Which command checks that all Kommander platform applications deployed successfully?", "o": ["`kubectl -n kommander wait --for condition=Ready helmreleases --all --timeout 15m`", "`kubectl -n kommander get pods --watch`", "`nkp get apps --ready`", "`helm list -A --failed`"], "a": [0], "e": "Kommander apps are deployed as Flux HelmReleases in the `kommander` namespace; wait for all of them to reach the Ready condition.", "r": "Verifying Kommander Installation"}, {"id": "2.2-08", "obj": "2.2", "q": "A HelmRelease in the kommander namespace is stuck in an 'exhausted' or 'another rollback/release in progress' state. How do you trigger a reconciliation?", "o": ["Patch the HelmRelease to set `spec.suspend` to true, then patch it back to false", "Delete the kommander namespace", "Restart the bastion host", "Run `nkp delete bootstrap`"], "a": [0], "e": "The docs suspend and then resume the HelmRelease with two `kubectl -n kommander patch helmrelease <name>` commands, which triggers a fresh reconciliation.", "r": "Verifying Kommander Installation"}, {"id": "2.2-09", "obj": "2.2", "q": "An administrator wants `nkp install kommander` to return immediately without waiting for all applications to become ready. Which flag is used?", "o": ["`--wait=false`", "`--no-verify`", "`--async`", "`--skip-ready-check`"], "a": [0], "e": "Set `--wait=false` to skip waiting, then check progress with `kubectl -n kommander wait --for condition=Ready helmreleases --all`.", "r": "Verifying Kommander Installation"}, {"id": "2.2-10", "obj": "2.2", "q": "In kommander.yaml, which two methods can be used to pass Helm values to a platform application?", "o": ["An inline `values` block under the application", "A `valuesFrom` field that points to a separate YAML file", "Both `values` and `valuesFrom` together for the same application", "A ConfigMap named `kommander-values` created before installing", "Environment variables prefixed with `KOMMANDER_`"], "a": [0, 1], "e": "Each app can be configured inline with `values` or by referencing a file with `valuesFrom` (relative or absolute path). Only one of the two may be set for an application.", "r": "Kommander Configuration Reference"}, {"id": "2.2-11", "obj": "2.2", "q": "Which command opens the NKP UI and displays the default login credentials?", "o": ["`nkp open dashboard --kubeconfig=${CLUSTER_NAME}.conf`", "`nkp get ui --password`", "`kubectl port-forward svc/kommander 8443`", "`nkp login --admin`"], "a": [0], "e": "`nkp open dashboard --kubeconfig=${CLUSTER_NAME}.conf` opens the UI with the default credentials.", "r": "Logging into the UI with Kommander"}, {"id": "2.2-12", "obj": "2.2", "q": "Where are the default NKP UI static credentials stored?", "o": ["In the `nkp-credentials` secret in the `kommander` namespace", "In the `nutanix-creds` secret in `capx-system`", "In the `dex` ConfigMap in `kube-system`", "In the bastion's ~/.nkp/credentials file"], "a": [0], "e": "Retrieve them with `kubectl -n kommander get secret nkp-credentials -o go-template=...` (decoding the username and password).", "r": "Logging into the UI with Kommander"}, {"id": "2.2-13", "obj": "2.2", "q": "Which two statements about the default static NKP UI credentials are correct?", "o": ["They should be used only to access the UI and configure an external identity provider, then kept as backup credentials", "The password can be rotated with `nkp experimental rotate dashboard-password`", "They are the recommended credentials for day-to-day administration by all admins", "They are automatically synced to Prism Central", "They expire after 24 hours"], "a": [0, 1], "e": "Use the static credentials only to configure an external identity provider and treat them as backup credentials. Rotate the password with `nkp experimental rotate dashboard-password`.", "r": "Logging into the UI with Kommander"}, {"id": "2.2-14", "obj": "2.2", "q": "An administrator installs a minimal Kommander for a demo cluster and now wants to test the logging stack. Besides grafana-logging, which two applications must be enabled?", "o": ["grafana-loki", "rook-ceph-cluster", "kube-prometheus-stack", "velero", "kubecost"], "a": [0, 1], "e": "To enable the logging stack, set enabled to true for grafana-logging, grafana-loki, logging-operator, rook-ceph and rook-ceph-cluster.", "r": "Installing Kommander in a Small Environment"}, {"id": "2.2-15", "obj": "2.2", "q": "Why does Nutanix advise against applying an NKP Ultimate license to a minimal, single-cluster demo installation?", "o": ["Ultimate is designed for multi-cluster fleet management, and the extra components can exhaust a small environment's resources", "Ultimate licenses cannot be applied to single clusters", "Ultimate disables the NKP UI on small clusters", "Ultimate requires an air-gapped installation"], "a": [0], "e": "The Ultimate license is designed for multi-cluster environments and fleet management; applying it adds modifications that can exhaust a small environment's resources.", "r": "Installing Kommander in a Small Environment"}, {"id": "2.2-16", "obj": "2.2", "q": "What is the default value of the `ai-navigator-app` entry in the Kommander installer configuration?", "o": ["true, unless installing in an air-gapped environment", "false in all environments", "true in all environments, including air-gapped", "It is only present with an Ultimate license"], "a": [0], "e": "The ai-navigator-app entry defaults to true unless you install in an air-gapped environment. Set it to false if you do not want AI Navigator.", "r": "Kommander Configuration Reference"}, {"id": "2.2-17", "obj": "2.2", "q": "Which two statements about configuring a custom domain and certificate for Kommander are correct?", "o": ["During Kommander installation, it can only be configured for the Management or Pro cluster", "After Kommander is installed, it can be configured for all cluster types", "It can only be configured during installation", "It requires an NKP Starter license", "Let's Encrypt works in air-gapped environments"], "a": [0, 1], "e": "Configuring during installation is supported only for Pro or Management clusters; configuring after installation works for all cluster types. ACME providers like Let's Encrypt need Internet access, so they don't work air-gapped.", "r": "Configuring the Kommander Installation with a Custom Domain and Certificate"}, {"id": "2.2-18", "obj": "2.2", "q": "An air-gapped environment needs a trusted certificate for the NKP UI. Which option is valid?", "o": ["A manually created certificate from a trusted CA (or the default cluster-issued self-signed certificate)", "An ACME certificate from Let's Encrypt", "An ACME certificate from ZeroSSL", "A certificate issued by Prism Central automatically"], "a": [0], "e": "Public ACME CAs require Internet access. In air-gapped environments, use the cluster's default self-signed certificates or a manually created certificate from a trusted CA.", "r": "Configuring the Kommander Installation with a Custom Domain and Certificate"}, {"id": "2.2-19", "obj": "2.2", "q": "For a managed or attached cluster with a custom certificate, where are the KommanderCluster object and the Issuer/certificate secret stored?", "o": ["The KommanderCluster is on the management cluster; the Issuer, ClusterIssuer or certificateSecret is on the managed/attached cluster", "Both are stored on the managed/attached cluster", "Both are stored on the management cluster", "Both are stored in Prism Central"], "a": [0], "e": "In managed and attached clusters, the KommanderCluster object is stored on the management cluster, while the Issuer, ClusterIssuer or certificateSecret is stored on the managed or attached cluster.", "r": "Configuring the Kommander Installation with a Custom Domain and Certificate"}, {"id": "2.2-20", "obj": "2.2", "q": "When automating certificates with ACME, what is the difference between an HTTP solver and a DNS solver?", "o": ["HTTP requires the cluster to be publicly reachable through its ingress or load balancer; DNS does not", "DNS requires the cluster to be public; HTTP does not", "HTTP only works with self-signed certificates", "There is no difference"], "a": [0], "e": "The HTTP solver exposes the cluster to the public Internet, so it must be publicly accessible; the DNS solver keeps traffic hidden. Proxied access for network-restricted clusters requires DNS.", "r": "Configuring the Kommander Installation with a Custom Domain and Certificate"}, {"id": "2.2-21", "obj": "2.2", "q": "An administrator obtained an NKP Pro license token from the Nutanix Support Portal. Where is it added in the NKP UI?", "o": ["Global workspace > Administration > Licensing > + Activate License", "Default workspace > Clusters > Add License", "Project > Settings > License", "Prism Central > Admin Center > Licensing"], "a": [0], "e": "Log in, select the Global workspace, go to Administration > Licensing, remove any existing license, select + Activate License, choose Nutanix or D2iQ, paste the token and Save.", "r": "Adding an NKP License"}, {"id": "2.2-22", "obj": "2.2", "q": "Which two statements about adding an NKP license are correct?", "o": ["Newly created clusters have a placeholder license that must be removed before adding the new license", "Only an administrator can add licenses", "Licenses are added with `nkp install license`", "A license can be downgraded from Ultimate to Pro at any time", "The license key is entered in Prism Element"], "a": [0, 1], "e": "New clusters come with a placeholder license that must be removed first, and you must be an administrator to add (or remove) licenses. Licenses are added in the NKP UI and cannot be downgraded.", "r": "Adding an NKP License"}, {"id": "2.2-23", "obj": "2.2", "q": "On the Activate License form, which license sources can be selected?", "o": ["Nutanix or D2iQ, depending on where the license was purchased", "Nutanix or Red Hat", "AWS Marketplace or Azure Marketplace only", "No source; the key is auto-detected"], "a": [0], "e": "On the Activate License page you select either Nutanix or D2iQ, depending on where you purchased the license, then paste the key.", "r": "Adding an NKP License"}, {"id": "2.2-24", "obj": "2.2", "q": "Which two platform applications are deployed by default on the management cluster only for NKP Ultimate customers?", "o": ["karma", "thanos", "dex", "kommander-appmanagement", "traefik-forward-auth-mgmt"], "a": [0, 1], "e": "Centralized Grafana, Centralized Kubecost, Karma and Thanos are marked as Ultimate-only apps deployed by default for Ultimate customers. Dex, AppManagement and Traefik ForwardAuth are deployed for all.", "r": "Management Cluster Application Requirements"}, {"id": "2.2-25", "obj": "2.2", "q": "How does Kommander deploy and reconcile its platform applications on a cluster?", "o": ["As Flux HelmReleases (helm.toolkit.fluxcd.io) managed by the Kommander Flux component", "As raw manifests applied by a cron job", "As Helm 2 releases managed by Tiller", "As Prism Central Calm blueprints"], "a": [0], "e": "Kommander applications appear as `helmrelease.helm.toolkit.fluxcd.io` objects in the kommander namespace, reconciled by Flux (kommander-flux).", "r": "Verifying Kommander Installation"}, {"id": "2.2-26", "obj": "2.2", "q": "Which prerequisite must be met on the target cluster before running `nkp install kommander`?", "o": ["A default StorageClass is configured", "Velero is installed", "An NKP Ultimate license is applied", "The bootstrap cluster is still running"], "a": [0], "e": "Before installing Kommander, ensure you have a default StorageClass and enough resources for the management cluster applications.", "r": "Installling Kommander"}, {"id": "2.2-27", "obj": "2.2", "q": "An administrator does not know the exact name of the cluster to install Kommander on. Which command lists the clusters?", "o": ["`kubectl get clusters -A`", "`nkp list clusters --all`", "`kubectl get nodes -A`", "`nkp describe workspace`"], "a": [0], "e": "The docs suggest `kubectl get clusters -A` to display cluster names if you don't know them.", "r": "Installing Kommander in a Non-Air-gapped Environment"}, {"id": "3.1-01", "obj": "3.1", "q": "Which two types of identity providers can be configured for NKP authentication?", "o": ["LDAP", "SAML", "Kerberos keytab files", "RADIUS", "Prism Element local users"], "a": [0, 1], "e": "NKP (through Dex) supports GitHub, LDAP, SAML and standard OIDC providers such as Google. You can configure as many identity providers as you want.", "r": "Identity Providers"}, {"id": "3.1-02", "obj": "3.1", "q": "Where in the NKP UI does an administrator add an external identity provider?", "o": ["Global workspace > Administration > Identity Providers > Identity Providers tab > Add Identity Provider", "Project > Settings > Authentication", "Cluster > Applications > Dex", "Prism Central > Admin Center > IAM"], "a": [0], "e": "Select the Global workspace, then Administration > Identity Providers, open the Identity Providers tab and select Add Identity Provider. Choose the provider type and the target workspace.", "r": "Configuring an Identity Provider Through the UI"}, {"id": "3.1-03", "obj": "3.1", "q": "A service provider wants each tenant to log in through its own identity provider with a dedicated login page. How should the identity providers be configured?", "o": ["Configure an identity provider per workspace instead of for All Workspaces", "Configure one global identity provider and filter users with OIDC claims", "Create a separate management cluster per tenant", "Configure the identity providers in each project"], "a": [0], "e": "An identity provider can be configured globally (All Workspaces) or per workspace. Per-workspace identity providers give each tenant a dedicated login page — useful for multi-tenancy.", "r": "Identity Providers"}, {"id": "3.1-04", "obj": "3.1", "q": "Which identity provider type cannot limit which users are allowed to log in based on their identity?", "o": ["OIDC", "GitHub", "LDAP", "SAML"], "a": [0], "e": "Access limitations: GitHub can restrict by organizations and teams, LDAP can use user/group search filters, SAML provides SSO, but the OIDC provider cannot limit users based on identity.", "r": "Identity Providers"}, {"id": "3.1-05", "obj": "3.1", "q": "When registering a GitHub OAuth application for NKP login, what should the Authorization callback URL be?", "o": ["The cluster URL followed by `/dex/callback`", "The cluster URL followed by `/token`", "The Prism Central URL followed by `/oauth`", "`https://github.com/login/oauth/authorize`"], "a": [0], "e": "In the GitHub OAuth app, set the Authorization callback URL to your cluster URL with `/dex/callback` appended, then copy the Client ID and Client Secret into the NKP UI.", "r": "Adding an Identity Provider Using GitHub"}, {"id": "3.1-06", "obj": "3.1", "q": "Which Kubernetes resource is used to configure an LDAP connector for NKP from the CLI?", "o": ["A Dex `Connector` (dex.mesosphere.io/v1alpha1) plus a Secret holding the bind password", "A `ClusterIssuer` in cert-manager", "An `AppDeployment` named ldap", "A `ConfigMap` named ldap-config in kube-system"], "a": [0], "e": "LDAP is configured by applying a Secret with the bind password and a `Connector` resource of type ldap (apiVersion dex.mesosphere.io/v1alpha1) with bindDN, userSearch and groupSearch settings.", "r": "Adding an LDAP Connector"}, {"id": "3.1-07", "obj": "3.1", "q": "An LDAP connector should serve all workspaces. In which namespace are the Connector and its password Secret created?", "o": ["kommander", "kube-system", "dex", "default"], "a": [0], "e": "For a global LDAP identity provider, the Secret and Connector are created in the `kommander` namespace. For a workspace-scoped provider, they go in that workspace's namespace.", "r": "Adding an LDAP Connector"}, {"id": "3.1-08", "obj": "3.1", "q": "LDAP logins fail with 'Internal Server Error' and 'Login error'. Where should the administrator look to find the root cause?", "o": ["The Dex pod logs in the kommander namespace (`kubectl logs -f <dex-pod> -n kommander`)", "The Prism Central audit log", "The Traefik access log on the bastion", "The kube-apiserver audit log only"], "a": [0], "e": "Most LDAP connector problems show up only at login. Read the Dex log in the kommander namespace — for example, a search filter that returns multiple results or a DNS lookup failure.", "r": "LDAP Troubleshooting"}, {"id": "3.1-09", "obj": "3.1", "q": "A user authenticated through an external identity provider needs kubectl access. Which two methods does NKP provide?", "o": ["Select Generate Token in the NKP UI and download a kubeconfig, regenerating it every 24 hours", "Enable the Konvoy Async Plugin so tokens are generated automatically through Dex", "Copy the admin static credentials from the nkp-credentials secret", "Create a long-lived ServiceAccount token per user", "Use Prism Central credentials directly with kubectl"], "a": [0, 1], "e": "Identity-provider users don't have static credentials. They either generate a token in the UI (valid 24 hours) or configure the Konvoy Async (credentials) Plugin, which routes authentication through Dex OIDC and generates tokens automatically.", "r": "Kubectl API Access Using an Identity Provider"}, {"id": "3.1-10", "obj": "3.1", "q": "What is the default client access token lifetime in NKP, and where is it changed?", "o": ["24 hours; change `config.expiry.idTokens` in the Dex app values in the Kommander installer configuration", "1 hour; change it in Prism Central", "7 days; change it in the Traefik AppDeployment", "Tokens never expire"], "a": [0], "e": "By default the client access token lifetime is 24 hours. Extend it, for example to 48h, with `dex.values.config.expiry.idTokens` in kommander.yaml.", "r": "Access Token Lifetime"}, {"id": "3.1-11", "obj": "3.1", "q": "In NKP role bindings, how are groups coming from an external identity provider written?", "o": ["Prefixed with `oidc:` — for example `oidc:engineering`", "Prefixed with `ldap:` — for example `ldap:engineering`", "Without any prefix", "Prefixed with `group:`"], "a": [0], "e": "All external groups are prefixed with `oidc:` (for example `oidc:devops`) to prevent collisions with locally defined groups.", "r": "Access Control"}, {"id": "3.1-12", "obj": "3.1", "q": "An identity provider is configured for one specific workspace named tenant-z. How is the IdP group 'engineering' written when adding it to an NKP group?", "o": ["`oidc:tenant-z:engineering`", "`oidc:engineering`", "`tenant-z/engineering`", "`engineering@tenant-z`"], "a": [0], "e": "For workspace-scoped identity providers, groups use `oidc:<workspace_name>:<group>` and users use `<workspace_ID>:<user_email>`. Global providers use `oidc:<group>` and the plain user email.", "r": "Configuring Workspace Role Bindings"}, {"id": "3.1-13", "obj": "3.1", "q": "NKP access control uses two conceptual groups of roles. Which two are they?", "o": ["Kommander Roles, which control access to resources on the management cluster", "Cluster Roles, which control access to resources on the target clusters", "Prism Roles, which control access to Prism Central", "Velero Roles, which control backup access", "Registry Roles, which control image pulls"], "a": [0, 1], "e": "Kommander Roles control access to resources on the management cluster; Cluster Roles control access on target clusters. Both apply at Global, Workspace and Project scope.", "r": "Access Control"}, {"id": "3.1-14", "obj": "3.1", "q": "A Cluster Role is bound at the Project level. What does NKP create on the target clusters in the project?", "o": ["Namespaced Roles in the project namespace", "ClusterRoles on every cluster in every workspace", "ClusterRoles on the management cluster only", "Nothing; project roles apply only in the UI"], "a": [0], "e": "At Global and Workspace scope, Cluster Roles are federated as ClusterRoles; at Project scope they are federated as namespaced Roles in the project namespace on all target clusters in the project.", "r": "Access Control"}, {"id": "3.1-15", "obj": "3.1", "q": "Besides a Kommander role, what else must be granted for an external user or group to be able to use the NKP UI?", "o": ["An appropriate NKP (dkp-*) ClusterRole, such as dkp-kommander-view or dkp-admin, that grants access to the UI routes", "A Prism Central admin role", "Membership in the `system:masters` group", "A Velero restore role"], "a": [0], "e": "In addition to a Kommander Role, you must grant the appropriate NKP role (for example dkp-kommander-admin and dkp-admin, which cover non-resource URLs such as /dkp/*) to let external users and groups into the UI.", "r": "Limitation for Kommander Roles"}, {"id": "3.1-16", "obj": "3.1", "q": "Which default role is bound to the default dashboard user and grants all verbs on all resources, including non-resource URLs?", "o": ["cluster-admin", "dkp-view", "dkp-kommander-edit", "kommander-workspace-admin"], "a": [0], "e": "cluster-admin is a system role that grants permission to all actions on any resource, including non-resource URLs. The default dashboard user is bound to it.", "r": "Default Roles"}, {"id": "3.1-17", "obj": "3.1", "q": "Which annotation controls whether a KommanderWorkspaceRole is automatically propagated to the equivalent project role?", "o": ["`workspace.kommander.mesosphere.io/sync-to-project: \"true\"`", "`kommander.d2iq.io/propagate: \"true\"`", "`project.kommander.mesosphere.io/inherit: \"true\"`", "`rbac.authorization.k8s.io/aggregate-to-project: \"true\"`"], "a": [0], "e": "Workspace Admin, Edit and View roles propagate to the matching project roles by default. Propagation is controlled with the `workspace.kommander.mesosphere.io/sync-to-project` annotation, managed only through the CLI.", "r": "Propagating Workspace Roles to Projects"}, {"id": "3.1-18", "obj": "3.1", "q": "Which two statements about local users in NKP are correct?", "o": ["They are defined as Dex static passwords (email plus bcrypt hash), for example in a dex-overrides ConfigMap", "A new local user has no permissions until an RBAC role binding is created", "Nutanix recommends local users for production clusters", "Local users are synchronized from Prism Central", "Local user passwords are stored in plain text in kommander.yaml"], "a": [0, 1], "e": "Local users are created with Dex `staticPasswords` (bcrypt hashes, e.g. generated with htpasswd), during install in kommander.yaml or afterwards with a dex-overrides ConfigMap referenced from the dex AppDeployment. They have no permissions until bound to a role. Nutanix does not recommend them for production.", "r": "Local Users"}, {"id": "3.1-19", "obj": "3.1", "q": "Users who belong to a very large number of groups receive HTTP 500 errors when opening NKP web services. What is the documented fix if the number of groups cannot be reduced?", "o": ["Enable the `clusterStorage` option of traefik-forward-auth so claims are stored in a Kubernetes secret instead of browser cookies", "Increase the Dex token lifetime", "Disable SSO and use static credentials", "Add more replicas to Traefik"], "a": [0], "e": "Traefik Forward Auth (TFA) stores user metadata in encrypted browser cookies, limited to 4 KB each. With many groups this overflows; enabling `clusterStorage` stores the claims as a secret (garbage-collected after 12 hours), at some performance cost.", "r": "Traefik-Forward-Authentication in NKP (TFA)"}, {"id": "3.1-20", "obj": "3.1", "q": "Which NKP component authenticates and authorizes web (HTTP) requests to the NKP UI and other protected HTTP services?", "o": ["Traefik Forward Authentication (traefik-forward-auth)", "Gatekeeper", "Kubefed", "Reloader"], "a": [0], "e": "TFA handles authentication and authorization of web requests and how users access the NKP UI, whatever the authentication method. It is deployed on all attached, managed and management clusters.", "r": "Traefik-Forward-Authentication in NKP (TFA)"}, {"id": "3.1-21", "obj": "3.1", "q": "Which component enforces admission policies in NKP, and why should it not be disabled casually?", "o": ["Gatekeeper; it ships with constraint templates that enforce multi-tenancy in projects", "Dex; it enforces Pod Security admission", "Velero; it blocks privileged pods", "Kubecost; it enforces resource quotas"], "a": [0], "e": "Gatekeeper (OPA Constraint Framework) enforces ConstraintTemplates and Constraints. The docs warn it is deployed pre-configured with constraint templates that enforce multi-tenancy in projects.", "r": "Enforcing Policies Using Gatekeeper"}, {"id": "3.1-22", "obj": "3.1", "q": "With Gatekeeper, what must be defined before a Constraint can be created?", "o": ["A ConstraintTemplate that contains the Rego logic and the constraint schema", "A PodSecurityPolicy", "A NetworkPolicy", "A ValidatingAdmissionPolicy in Prism Central"], "a": [0], "e": "Gatekeeper uses the OPA Constraint Framework: first define a ConstraintTemplate (Rego plus schema), then create Constraints that tell Gatekeeper to enforce it.", "r": "Enforcing Policies Using Gatekeeper"}, {"id": "3.1-23", "obj": "3.1", "q": "Where are new custom Cluster Roles created in the NKP UI?", "o": ["Administration > Access Control > Cluster Roles tab > + Create Role", "Clusters > Add Infrastructure Provider", "Applications > Catalog", "Projects > ConfigMaps"], "a": [0], "e": "In the Administration section select Access Control, open the Cluster Roles tab, choose + Create Role, set the type to Cluster Role and add rules (for example get, list, watch on all resources for a read-only role).", "r": "Creating Custom Roles"}, {"id": "3.2-01", "obj": "3.2", "q": "Is logging enabled by default on NKP managed and attached clusters?", "o": ["No — logging must be enabled explicitly at the workspace level", "Yes — the full logging stack is always deployed", "Only on attached clusters", "Only on clusters with GPUs"], "a": [0], "e": "Logging is disabled by default on managed and attached clusters. Enable the logging applications explicitly at the workspace level to capture and view log data.", "r": "Workspace-level Logging"}, {"id": "3.2-02", "obj": "3.2", "q": "Arrange the NKP log write path: which order is correct?", "o": ["Fluent Bit → Fluentd (Logging Operator) → Loki Gateway → Loki Distributor → Loki Ingester", "Fluentd → Fluent Bit → Grafana → Loki", "Loki → Fluent Bit → Fluentd → Grafana", "Fluent Bit → Prometheus → Loki → Grafana"], "a": [0], "e": "Fluent Bit on each node collects logs and forwards them to Fluentd, which processes them and sends them through the Loki Gateway to the Distributor, which chunks them for the Ingesters to compress, index and persist.", "r": "Logging Architecture"}, {"id": "3.2-03", "obj": "3.2", "q": "Which Loki component splits incoming log queries into smaller parts and combines the results from the queriers?", "o": ["Query Frontend", "Distributor", "Compactor", "Ingester"], "a": [0], "e": "The Query Frontend splits queries, forwards them to Queriers and merges the results. The Distributor handles writes, the Ingester persists chunks, and the Compactor compacts indexes and applies retention.", "r": "Logging Architecture"}, {"id": "3.2-04", "obj": "3.2", "q": "An administrator enables workspace-level logging through the UI. Besides Grafana Loki, Logging Operator and Grafana Logging, which two applications must be enabled?", "o": ["Rook Ceph", "Rook Ceph Cluster", "Velero", "Kubecost", "Karma"], "a": [0, 1], "e": "The logging stack uses Rook Ceph and Rook Ceph Cluster as Loki's object storage. Enable them, then Grafana Loki, Logging Operator and Grafana Logging (Traefik and cert-manager must also be enabled).", "r": "Enabling Logging Applications Using the UI"}, {"id": "3.2-05", "obj": "3.2", "q": "Which command creates the logging-operator AppDeployment for a workspace from the CLI?", "o": ["`nkp create appdeployment logging-operator --app logging-operator-<version> --workspace ${WORKSPACE_NAME}`", "`kubectl apply -f logging-operator.yaml -n kube-system`", "`nkp enable logging --workspace ${WORKSPACE_NAME}`", "`helm install logging-operator`"], "a": [0], "e": "Workspace logging apps are enabled by creating AppDeployments on the management cluster with `nkp create appdeployment <name> --app <app-id-version> --workspace <workspace>`.", "r": "Creating AppDeployments to Enable Workspace Logging"}, {"id": "3.2-06", "obj": "3.2", "q": "An administrator wants to stop collecting pod logs from two noisy namespaces. What is the documented approach?", "o": ["Create a `logging-operator-logging-overrides` ConfigMap that excludes the namespaces in the cluster-containers clusterFlow, and reference it in the logging-operator AppDeployment's `configOverrides`", "Delete the Fluent Bit DaemonSet in those namespaces", "Label the namespaces with `logging=false`", "Disable Grafana Loki for the workspace"], "a": [0], "e": "Restrict logging with an override ConfigMap whose clusterFlows exclude the namespaces, then set `spec.configOverrides.name` on the logging-operator AppDeployment (for example with `nkp edit appdeployment`).", "r": "Overriding ConfigMap to Restrict Logging"}, {"id": "3.2-07", "obj": "3.2", "q": "Which two types of logs does the admin-level Fluent Bit instance collect?", "o": ["Kubernetes audit logs", "Logs of host processes managed by systemd (and kernel logs)", "Application pod stdout logs", "Prism Central logs", "Velero backup data"], "a": [0, 1], "e": "The admin-level Fluent Bit collects systemd host process logs, kernel logs and Kubernetes audit logs and sends them to the workspace Loki — isolating sensitive logs from the Logging Operator. Pod logs go through the Logging Operator.", "r": "Admin-level Logs"}, {"id": "3.2-08", "obj": "3.2", "q": "Why is the Fluent Bit (admin logs) application disabled by default on the management cluster?", "o": ["Admin logs need extra Rook Ceph disk space — roughly 2 GB per day per node", "Fluent Bit is incompatible with Loki", "It requires an NKP Ultimate license", "It conflicts with Velero"], "a": [0], "e": "Fluent Bit is disabled by default on the management cluster because ingesting admin logs needs additional disk space on rook-ceph-cluster — around 2 GB/day per node.", "r": "Fluent Bit"}, {"id": "3.2-09", "obj": "3.2", "q": "Enabling Kubernetes audit log collection with the kommander-fluent-bit AppDeployment has what effect on the logging stack?", "o": ["Log traffic increases by about 3–4 times, so all logging stack components should be scaled up", "Log traffic decreases because audit logs replace pod logs", "No measurable effect", "Loki is replaced with Elasticsearch"], "a": [0], "e": "Enabling audit logging increases inbound log traffic by approximately 3–4x; consider scaling up all logging stack components.", "r": "Audit Log"}, {"id": "3.2-10", "obj": "3.2", "q": "In a high log-traffic environment, which Grafana Loki component does Nutanix recommend scaling up first?", "o": ["Ingester", "Distributor", "Query Frontend", "Compactor"], "a": [0], "e": "Scale the Ingester first. Scale the Distributor only when it's under compute stress; there should usually be far fewer Distributors than Ingesters. NKP deploys Loki in microservices mode.", "r": "Logging Stack"}, {"id": "3.2-11", "obj": "3.2", "q": "How long does NKP retain Grafana Loki logs by default, and what is the minimum configurable retention?", "o": ["One week by default; minimum 24 hours", "30 days; minimum 7 days", "24 hours; minimum 1 hour", "Forever; no minimum"], "a": [0], "e": "Loki retains log metadata and logs for one week using the Compactor. Retention can be customized with configOverrides (`limits_config.retention_period`), with a minimum of 24 hours.", "r": "Overriding ConfigMap to Modify the Storage Retention"}, {"id": "3.2-12", "obj": "3.2", "q": "Which two statements about multi-tenant (project-level) logging are correct?", "o": ["Workspace-level logging must be enabled first", "Each project namespace gets its own Loki and Grafana, with a Flow that sends that namespace's pod logs to its Loki", "It is available with NKP Starter", "All projects share one Grafana with no RBAC separation", "It requires Fluent Bit on every node to be disabled"], "a": [0, 1], "e": "Multi-tenant logging (Ultimate) builds on workspace logging: a controller deploys Loki and Grafana per project namespace with a logging-operator Flow, so team members see only their namespaces' logs.", "r": "Multi-Tenant Logging"}, {"id": "3.2-13", "obj": "3.2", "q": "After enabling the workspace logging stack, how does an administrator check that it deployed on an attached cluster?", "o": ["Run `kubectl get helmreleases -n ${WORKSPACE_NAMESPACE}` against the attached cluster and confirm grafana-loki, logging-operator, rook-ceph and related releases are Ready", "Run `nkp get logging --status`", "Check the bastion's /var/log directory", "Open the Velero UI"], "a": [0], "e": "On the managed or attached cluster, run `kubectl get helmreleases -n ${WORKSPACE_NAMESPACE}` and look for grafana-logging, logging-operator, logging-operator-logging, grafana-loki, rook-ceph, rook-ceph-cluster and object-bucket-claims.", "r": "Verifying the Cluster Logging Stack Installation"}, {"id": "3.2-14", "obj": "3.2", "q": "After a Rook Ceph cluster is resized for more storage, what else should be increased so Loki can use the extra space?", "o": ["The ObjectBucketClaim storage limit (for example `nkp.grafana-loki.maxSize`) through a rook-ceph-cluster override", "The Prometheus retention period", "The Velero schedule interval", "Nothing; Loki uses all Ceph capacity automatically"], "a": [0], "e": "ObjectBucketClaims have a storage limit, enabled by default. After sizing up Ceph, raise the limit for grafana-loki (and project-grafana-loki) with override ConfigMaps.", "r": "Logging Stack"}, {"id": "3.2-15", "obj": "3.2", "q": "How much of the raw capacity of the default NKP Rook Ceph cluster is usable, and why?", "o": ["About 75% — erasure coding with k=3 data and m=1 parity (160 GiB raw gives about 120 GiB usable)", "100% — Ceph uses no redundancy", "50% — two-way replication", "33% — three-way replication"], "a": [0], "e": "The default CephCluster uses four 40 GiB PVCs (160 GiB raw) with erasure coding k=3, m=1, giving 75% efficiency — about 120 GiB for grafana-loki, project-grafana-loki and velero.", "r": "Rook Ceph in NKP"}, {"id": "3.2-16", "obj": "3.2", "q": "Fluent Bit isn't collecting systemd logs because the nodes' journald writes to /run/log/journal. What is the fix?", "o": ["Override the fluent-bit AppDeployment values to mount that path and set it as the systemd input Path", "Reinstall the OS with persistent journald storage", "Disable admin-level logging", "Change the Loki retention policy"], "a": [0], "e": "Fluent Bit reads systemd logs from /var/log/journal by default. For another path, create a fluent-bit override ConfigMap that adds the hostPath volume and mount and sets Path in the systemd [INPUT], then reference it in configOverrides.", "r": "Collecting systemd Logs from a Non-default Path"}, {"id": "3.3-01", "obj": "3.3", "q": "Which tool does NKP use as its platform application for cluster backup and restore?", "o": ["Velero", "Kasten K10", "Nutanix Mine", "etcdctl snapshots only"], "a": [0], "e": "NKP deploys Velero (integrated with Rook Ceph by default) for backup, restore and migration.", "r": "Velero Configuration"}, {"id": "3.3-02", "obj": "3.3", "q": "In which namespace is the Velero platform application installed in NKP, and how should the Velero CLI be configured?", "o": ["kommander; run `velero client config set namespace=kommander`", "velero; no configuration needed", "kube-system; run `velero install --namespace kube-system`", "default; run `velero client config set namespace=default`"], "a": [0], "e": "Unlike upstream, NKP installs Velero in the kommander namespace. Set the CLI's default namespace with `velero client config set namespace=kommander`.", "r": "Velero Installation Using CLI"}, {"id": "3.3-03", "obj": "3.3", "q": "Which two statements describe the default NKP backup configuration?", "o": ["Velero creates a daily backup of data from all namespaces", "Default backups do not create volume snapshots", "Backups are stored in Prism Central by default", "Backups run every 8 hours by default", "Backups are disabled until a license is applied"], "a": [0, 1], "e": "By default NKP configures a daily backup of all namespaces (the velero-default schedule), stored in the in-cluster Rook Ceph object store. Default backups do not support volume snapshots.", "r": "Setting a Backup Schedule"}, {"id": "3.3-04", "obj": "3.3", "q": "Why does Nutanix say the default Velero setup is not suitable for production?", "o": ["Backups are stored in Rook Ceph inside the same cluster (with a self-signed TLS certificate), so a cluster loss also loses the backups", "Velero is not licensed for production use", "The default schedule is too frequent", "Velero cannot back up Kubernetes objects"], "a": [0], "e": "By default Velero uses Rook Ceph over TLS with a self-signed certificate, operating inside the same cluster. For production, configure external storage such as a Nutanix Objects or S3 bucket.", "r": "Velero Installation Using CLI"}, {"id": "3.3-05", "obj": "3.3", "q": "Which command creates an additional Velero backup schedule that runs every 8 hours for a cluster?", "o": ["`velero create schedule <name> -n ${WORKSPACE_NAMESPACE} --kubeconfig=${CLUSTER_NAME}.conf --snapshot-volumes=false --schedule=\"@every 8h\"`", "`nkp create backup --every 8h`", "`kubectl create cronjob velero --schedule=\"0 */8 * * *\"`", "`velero backup create <name> --repeat 8h`"], "a": [0], "e": "Velero schedules are created with `velero create schedule ... --schedule=\"@every 8h\"`, using the workspace namespace and the cluster's kubeconfig.", "r": "Creating Backup Schedules"}, {"id": "3.3-06", "obj": "3.3", "q": "An administrator wants the default backup to run every 24 hours with different settings. What is the documented procedure?", "o": ["`velero get schedules`, `velero delete schedule velero-default`, then recreate `velero-default` with the new settings", "Edit the velero-default CronJob in kube-system", "Change the schedule in Prism Central", "Reinstall Kommander"], "a": [0], "e": "Check current schedules, delete the velero-default schedule, then create a new velero-default schedule with your custom settings.", "r": "Changing the Default Backup Service Settings"}, {"id": "3.3-07", "obj": "3.3", "q": "Before upgrading NKP components, the administrator wants an immediate backup outside the regular schedule. Which command is used?", "o": ["`velero backup create <backup-name> -n ${WORKSPACE_NAMESPACE} --kubeconfig=${CLUSTER_NAME}.conf --snapshot-volumes=false`", "`velero schedule run velero-default`", "`nkp backup now`", "`kubectl create backup`"], "a": [0], "e": "Create an on-demand backup with `velero backup create`. The docs recommend this before upgrading components or modifying the cluster configuration.", "r": "Backing Up on Demand"}, {"id": "3.3-08", "obj": "3.3", "q": "How can a Velero schedule be limited to specific namespaces?", "o": ["Add `--include-namespaces=<ns1>,<ns2>` to `velero create schedule`", "Label the namespaces with `velero.io/backup=true`", "Create one Velero install per namespace", "It cannot; Velero always backs up every namespace"], "a": [0], "e": "Use `--include-namespaces` (for example kube-system,kube-public,kommander) when creating the schedule — useful when multiple teams run apps on a cluster.", "r": "Creating a Backup Schedule for a Specific Namespace"}, {"id": "3.3-09", "obj": "3.3", "q": "Before restoring a management cluster from a Velero backup, which two requirements must be verified?", "o": ["The Rook Ceph backend storage is still operational", "Velero is set to restore-only mode so no backups run during the restore", "All workload clusters have been deleted", "The cluster has been downgraded to NKP Starter", "Kommander has been uninstalled"], "a": [0, 1], "e": "Before restoring, verify that the Rook Ceph cluster and the Velero service are still operational and that Velero is in restore-only mode to avoid backups running during the restore.", "r": "Restoring a Cluster from Backup"}, {"id": "3.3-10", "obj": "3.3", "q": "Which two preparation steps are documented before running a Velero restore on the management cluster?", "o": ["Delete the `one-kommandercluster-per-kommander-workspace` ResourceQuota in the kommander namespace", "Remove the CREATE operation from the `kommander-validating` webhook so workspaces with pre-configured namespaces can be restored", "Delete all Velero schedules permanently", "Scale the control plane to one node", "Rotate the dashboard password"], "a": [0, 1], "e": "Delete the ResourceQuota (it is restored automatically) and patch the kommander-validating webhook to remove the CREATE operation. After the restore, verify the ResourceQuota came back and add the CREATE operation back to the webhook.", "r": "Restoring a Cluster from Backup"}, {"id": "3.3-11", "obj": "3.3", "q": "Which command restores cluster data from a specific Velero backup?", "o": ["`velero restore create --from-backup <BACKUP-NAME>`", "`velero backup restore <BACKUP-NAME>`", "`nkp restore cluster --backup <BACKUP-NAME>`", "`kubectl apply -f <BACKUP-NAME>.tar`"], "a": [0], "e": "List backups with `velero backup get`, then restore with `velero restore create --from-backup <BACKUP-NAME>`.", "r": "Restoring a Cluster from Backup"}, {"id": "3.3-12", "obj": "3.3", "q": "After a restore using the default in-cluster backup storage, `velero restore describe` shows an error retrieving logs. How do you confirm the restore succeeded?", "o": ["Check that the restore Phase is Completed and read the Velero pod logs with `kubectl logs -l name=velero -n kommander`", "Re-run the restore until the error disappears", "Check Prism Central alerts", "Delete the backup and create a new one"], "a": [0], "e": "This is a known issue when the object store isn't reachable from outside the cluster. Confirm the Phase is Completed (not in error) and view the logs with kubectl.", "r": "Restoring a Cluster from Backup"}, {"id": "3.3-13", "obj": "3.3", "q": "An administrator configures a Nutanix Objects bucket as the default Velero backup storage location. Which two steps are part of the documented procedure?", "o": ["Create a secret with the bucket's access keys (AWS-style profile) in the workspace namespace of the cluster where Velero runs", "Create a `velero-overrides` ConfigMap with the backupStorageLocation (provider aws, s3Url, s3ForcePathStyle) and reference it in the Velero AppDeployment's configOverrides", "Install the Velero plugin for Nutanix Files", "Mount the bucket as an NFS share on every node", "Disable Rook Ceph before creating the bucket"], "a": [0, 1], "e": "Nutanix Objects is S3-compatible: create the credentials secret, create a velero-overrides ConfigMap defining the BSL (provider aws, bucket, s3Url, profile, credential), patch the velero AppDeployment's configOverrides, and verify the BSL phase is Available.", "r": "Usage of Velero with Nutanix Objects Bucket"}, {"id": "3.3-14", "obj": "3.3", "q": "Which two commands help diagnose the health of Velero on a cluster?", "o": ["`velero get backup-locations`", "`velero get schedules`", "`nkp diagnose velero`", "`velero doctor`", "`kubectl get velero -A`"], "a": [0, 1], "e": "The documented diagnostics include `kubectl get all -A | grep velero` and `velero get schedules`, `backups`, `restores`, `backup-locations` and `snapshot-locations`.", "r": "Backup Service Diagnostics"}, {"id": "3.3-15", "obj": "3.3", "q": "When must the rook-ceph and rook-ceph-cluster applications remain enabled?", "o": ["When grafana-loki or velero is enabled (unless Velero is configured to use external storage)", "Always, even if logging and Velero are disabled", "Only when NKP Insights is disabled", "Only on attached clusters"], "a": [0], "e": "Enable rook-ceph and rook-ceph-cluster if grafana-loki is enabled or if velero is enabled — unless Velero overrides point to storage external to the cluster. If you use neither, Ceph can be disabled.", "r": "Rook Ceph in NKP"}, {"id": "3.4-01", "obj": "3.4", "q": "Which two components are deployed by the kube-prometheus-stack platform application?", "o": ["node-exporter on each node to collect hardware and OS metrics", "kube-state-metrics to generate metrics about the state of Kubernetes objects", "Fluent Bit to collect pod logs", "Velero to back up metrics", "Dex to authenticate Grafana"], "a": [0, 1], "e": "kube-prometheus-stack deploys prometheus-operator, Prometheus, Alertmanager, node-exporter, kube-state-metrics, Grafana and ServiceMonitors for internal Kubernetes components.", "r": "Cluster Metrics"}, {"id": "3.4-02", "obj": "3.4", "q": "How does NKP provide a centralized view of metrics from all attached and managed clusters?", "o": ["Thanos Query on the management cluster queries each cluster's Prometheus through a Thanos sidecar, displayed in a centralized Grafana", "Each cluster pushes metrics to Prism Central", "Velero copies metrics to the management cluster nightly", "Kubefed federates Prometheus TSDB blocks"], "a": [0], "e": "Centralized metrics use Thanos: Thanos Query reaches each cluster's Prometheus via a Thanos sidecar, and a dedicated centralized Grafana uses Thanos Query as its data source.", "r": "Centralized Metrics"}, {"id": "3.4-03", "obj": "3.4", "q": "An attached cluster goes offline. What happens to its metrics in the centralized monitoring view?", "o": ["They're no longer shown, including past data, because metrics are read remotely and not backed up", "Historical data stays available on the management cluster for 15 days", "Metrics are replayed from Velero backups", "Prism Central keeps a copy"], "a": [0], "e": "Cluster metrics are read remotely by Kommander and are not backed up. If an attached cluster goes down, Kommander no longer collects or presents its metrics, including past data.", "r": "Centralized Metrics"}, {"id": "3.4-04", "obj": "3.4", "q": "Which tool aggregates the alerts from the Alertmanagers of all attached clusters into one dashboard?", "o": ["Karma", "Kubecost", "Thanos Compactor", "Reloader"], "a": [0], "e": "Karma aggregates all alerts from the Alertmanagers in attached clusters on one page. Silencing alerts from the Karma UI is not supported.", "r": "Centralized Alerts"}, {"id": "3.4-05", "obj": "3.4", "q": "How is an attached cluster identified in centralized monitoring and Kubecost views?", "o": ["By its monitoring ID, which is the UID of the cluster's kube-system namespace", "By its Prism Element cluster UUID", "By its control plane VIP", "By the workspace name"], "a": [0], "e": "The monitoring ID equals the kube-system namespace UID (`kubectl get namespace kube-system -o jsonpath='{.metadata.uid}'`) and is shown on the cluster's Configuration tab as Monitoring ID (clusterId).", "r": "Centralized Monitoring"}, {"id": "3.4-06", "obj": "3.4", "q": "An administrator adds a custom Grafana dashboard as a ConfigMap for a cluster's Grafana. Which label must the ConfigMap have so the sidecar imports it?", "o": ["`grafana_dashboard: \"1\"`", "`grafana_dashboard_kommander: \"1\"`", "`prometheus.kommander.d2iq.io/select: \"true\"`", "`app: grafana`"], "a": [0], "e": "The Grafana dashboard sidecar imports ConfigMaps labeled `grafana_dashboard: \"1\"`. For the centralized (Kommander) Grafana, use `grafana_dashboard_kommander: \"1\"`.", "r": "Adding Custom Dashboards"}, {"id": "3.4-07", "obj": "3.4", "q": "Prometheus is not scraping a custom application's ServiceMonitor. Which label must the ServiceMonitor have for kube-prometheus-stack in NKP to discover it?", "o": ["`prometheus.kommander.d2iq.io/select: \"true\"`", "`release: prometheus`", "`grafana_dashboard: \"1\"`", "`monitoring: enabled`"], "a": [0], "e": "Add the label `prometheus.kommander.d2iq.io/select: \"true\"` to the ServiceMonitor (or add it under `prometheus.additionalServiceMonitors` in the kube-prometheus-stack overrides). Apps should expose Prometheus-format metrics on /metrics.", "r": "Application Monitoring using Prometheus"}, {"id": "3.4-08", "obj": "3.4", "q": "How are the default kube-prometheus-stack alert rules for nodes turned off?", "o": ["Create a `kube-prometheus-stack-overrides` ConfigMap with `defaultRules.rules.node: false` and reference it in the AppDeployment's configOverrides", "Delete the node-exporter DaemonSet", "Silence the alerts in Karma", "Edit the PrometheusRule objects directly; they are not managed"], "a": [0], "e": "Alert rules are configured through an overrides ConfigMap (`defaultRules.rules.node: false`, or `defaultRules.create: false` to disable all) referenced with `nkp edit appdeployment ... kube-prometheus-stack`.", "r": "Configuring Alert Rules"}, {"id": "3.4-09", "obj": "3.4", "q": "Velero is enabled, but no Velero alerts ever fire. What is the most likely reason?", "o": ["Velero alert rules are turned off by default and must be enabled with `mesosphereResources.rules.velero: true` in the kube-prometheus-stack overrides", "Velero does not expose metrics", "Velero alerts only appear in Kubecost", "Velero alerts require NKP Insights"], "a": [0], "e": "Alert rules for the Velero platform service are off by default. Enable them only if Velero is enabled, via `mesosphereResources.rules.velero: true`.", "r": "Configuring Alert Rules"}, {"id": "3.4-10", "obj": "3.4", "q": "How is Alertmanager configured to send notifications to Slack or email in NKP?", "o": ["Overwrite the `alertmanager-kube-prometheus-stack-alertmanager` secret in the workspace namespace with a new alertmanager.yaml (and templates)", "Add a Slack webhook in the NKP UI license page", "Configure SMTP in Prism Central", "Edit the Karma ConfigMap"], "a": [0], "e": "Create the alertmanager.yaml (receivers, routes) and apply it as the `alertmanager-kube-prometheus-stack-alertmanager` secret with `kubectl create secret generic ... --dry-run=client --save-config -o yaml | kubectl apply -f -`.", "r": "Alerts Using AlertManager"}, {"id": "3.4-11", "obj": "3.4", "q": "Which two are examples of pre-defined alerts that NKP ships with through kube-prometheus-stack?", "o": ["KubeletNotReady", "KubeAPIDown", "PrismCentralDown", "VeleroLicenseExpired", "NutanixCSIQuotaFull"], "a": [0, 1], "e": "Examples include CPUThrottlingHigh, TargetDown, KubeletNotReady, KubeAPIDown, CoreDNSDown and KubeVersionMismatch, covering node state, system services, resource events and threshold breaches.", "r": "Alerts Using AlertManager"}, {"id": "3.4-12", "obj": "3.4", "q": "Which component provides centralized cost monitoring for all attached clusters, and how long are cost metrics retained by default?", "o": ["Kubecost, retaining up to 15 days of cost metrics", "Thanos, retaining 1 year", "Prometheus, retaining 90 days", "NKP Insights, retaining 30 days"], "a": [0], "e": "Centralized Kubecost on the management cluster provides cost monitoring across attached clusters; by default up to 15 days of cost metrics are retained, with no backup to an external store.", "r": "Centralized Cost Monitoring"}, {"id": "3.4-13", "obj": "3.4", "q": "Where must a purchased Kubecost license key be applied?", "o": ["To the Centralized Kubecost application running on the management cluster", "To each attached cluster's Kubecost separately", "In the NKP Global > Licensing page", "In Prism Central"], "a": [0], "e": "The docs warn that the Kubecost license key must be applied to the Centralized Kubecost application on the management cluster, through its Settings > Add License Key.", "r": "Adding a Kubecost License Key to Your Clusters"}, {"id": "3.4-14", "obj": "3.4", "q": "What does NKP Insights do?", "o": ["Detects current and future anomalies in workload configurations and Kubernetes clusters, with root-cause analysis and recommended steps", "Backs up clusters to Nutanix Objects", "Builds node OS images", "Provides the NKP UI login page"], "a": [0], "e": "NKP Insights is a predictive analytics solution that detects anomalies. Each insight alert includes a description, root cause analysis and recommended steps to lower MTTR.", "r": "Nutanix Kubernetes Platform Insights Overview"}, {"id": "3.4-15", "obj": "3.4", "q": "NKP Insights consists of which two components?", "o": ["NKP Insights Management, running on the management cluster", "NKP Insights Engine, running on each attached or managed cluster", "NKP Insights Collector, running in Prism Central", "NKP Insights Agent, running on the bastion", "NKP Insights Gateway, running in Traefik"], "a": [0, 1], "e": "Insights Management runs on the management cluster; the Insights Engine runs on each attached or managed cluster (or on the management cluster for single-cluster Pro environments) and must be explicitly enabled.", "r": "Nutanix Kubernetes Platform Insights Overview"}, {"id": "3.4-16", "obj": "3.4", "q": "Which severity levels can be toggled in the NKP Insights Alert table?", "o": ["Critical, Warning and Notice", "High, Medium and Low", "P1, P2 and P3", "Error and Info"], "a": [0], "e": "Insights alerts can be filtered by project, cluster, description and type, and toggled by severity level: Critical, Warning and Notice.", "r": "NKP Insights Engine"}, {"id": "3.4-17", "obj": "3.4", "q": "A managed cluster card shows the status 'Join Failed'. What does this usually indicate?", "o": ["Kubefed does not have permission to create entities in the target cluster", "The cluster's VMs are still being provisioned", "The license has expired", "The cluster was deleted from Prism Central"], "a": [0], "e": "'Join Failed' can appear when kubefed lacks permission to create entities in the target cluster. 'Pending Setup' means networking restrictions need more setup; 'Unattached' means a manually created cluster isn't attached yet.", "r": "Cluster Statuses"}, {"id": "3.4-18", "obj": "3.4", "q": "How do you set a specific storage capacity and resource requests/limits for Prometheus?", "o": ["Specify them in the kube-prometheus-stack overrides ConfigMap (prometheusSpec resources and the storage volumeClaimTemplate)", "Resize the Prometheus PVC directly in Prism Central", "Edit the node-exporter DaemonSet", "Set them in kommander.yaml under catalog"], "a": [0], "e": "Prometheus capacity and resources are set in the kube-prometheus-stack overrides ConfigMap — for example limits/requests and a volumeClaimTemplate storage request such as 100Gi.", "r": "Setting Storage Capacity for Prometheus"}, {"id": "3.5-01", "obj": "3.5", "q": "What triggers the NKP Cluster Autoscaler to add worker nodes?", "o": ["Pods that are pending because they cannot be scheduled", "High node CPU utilization reported by Prometheus", "The Horizontal Pod Autoscaler's metrics server", "A daily schedule"], "a": [0], "e": "Cluster Autoscaler scales worker nodes up or down based on the number of pending pods. Unlike the Horizontal Pod Autoscaler, it does not depend on a metrics server or Prometheus.", "r": "Configuring Nutanix Cluster Autoscaler"}, {"id": "3.5-02", "obj": "3.5", "q": "Which two annotations define the scale range that the Cluster Autoscaler uses for an NKP node pool?", "o": ["`cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size`", "`cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size`", "`autoscaling.kubernetes.io/min-nodes`", "`nkp.nutanix.com/autoscale-max`", "`machine.cluster.x-k8s.io/replicas`"], "a": [0, 1], "e": "The Cluster Autoscaler reads the `...-node-group-min-size` and `...-node-group-max-size` annotations on a MachineDeployment (node pool).", "r": "Configuring Nutanix Cluster Autoscaler"}, {"id": "3.5-03", "obj": "3.5", "q": "On an NKP cluster on Nutanix, how is autoscaling enabled for a worker node pool?", "o": ["Edit the Cluster object (`kubectl edit cluster ${CLUSTER_NAME}`) and set the min/max annotations on the machineDeployment under `spec.topology.workers`", "Run `nkp enable autoscaler --cluster ${CLUSTER_NAME}`", "Enable the cluster-autoscaler app in the NKP UI catalog", "Configure a scaling policy in Prism Central"], "a": [0], "e": "Find the node pool with `nkp get nodepool --cluster-name ${CLUSTER_NAME}`, then edit the cluster and set the min/max size annotations in the machineDeployment's metadata under spec.topology.workers.machineDeployments.", "r": "Configuring Nutanix Cluster Autoscaler"}, {"id": "3.5-04", "obj": "3.5", "q": "Which command lists the node pools of a cluster?", "o": ["`nkp get nodepool --cluster-name ${CLUSTER_NAME}`", "`kubectl get nodepools -A`", "`nkp describe nodes`", "`nkp list pools`"], "a": [0], "e": "`nkp get nodepool --cluster-name ${CLUSTER_NAME}` (or `nkp get nodepools -c <cluster> -n <workspace-namespace>`) lists node pools.", "r": "Configuring Nutanix Cluster Autoscaler"}, {"id": "3.5-05", "obj": "3.5", "q": "A node pool has autoscaler annotations min-size=2 and max-size=6. An administrator runs `nkp scale nodepools <pool> --replicas=7 -c <cluster>`. What happens?", "o": ["The command fails because the desired replicas exceed the configured max-size annotation", "The pool scales to 7 and the annotation is updated automatically", "The pool scales to 6 and a warning is logged", "The autoscaler is disabled and the pool scales to 7"], "a": [0], "e": "With autoscaler annotations set, manual scaling must stay within bounds. Scaling to 7 fails with 'desired replicas 7 is greater than the configured max size annotation'; scaling below min-size also fails.", "r": "Scaling Node Pools Using Cluster Autoscaler"}, {"id": "3.5-06", "obj": "3.5", "q": "After pending pods are gone and load drops, when does the Cluster Autoscaler start removing nodes by default?", "o": ["After the default timeout of 10 minutes", "Immediately", "After 24 hours", "Only when an administrator runs a scale-down command"], "a": [0], "e": "Cluster Autoscaler begins scaling down worker nodes after the default timeout of 10 minutes.", "r": "Configuring AWS Cluster Autoscaler"}, {"id": "3.5-07", "obj": "3.5", "q": "Where does the Cluster Autoscaler instance for an NKP managed (workload) cluster run?", "o": ["On the management cluster, pointed at the managed cluster through a kubeconfig secret", "On the managed cluster's control plane only", "On the bastion host", "In Prism Central"], "a": [0], "e": "An additional autoscaler instance runs on the management cluster and is pointed at the managed cluster (via a kubeconfig secret mounted into the deployment), because the cluster's CAPI objects live on the management cluster.", "r": "Configuring AWS Cluster Autoscaler"}, {"id": "3.5-08", "obj": "3.5", "q": "Where does the Cluster Autoscaler run for a self-managed management cluster, and how do you check that it's healthy?", "o": ["On the cluster itself as the cluster-autoscaler deployment in kube-system; check its logs for restarts or errors", "On the bootstrap cluster; check with `docker logs`", "In Prism Central; check the alerts page", "It does not run on management clusters"], "a": [0], "e": "On the management (self-managed) cluster, check the controller with `kubectl logs deployments/cluster-autoscaler cluster-autoscaler -n kube-system -f`. The logs show node groups and pending pods being watched.", "r": "Configuring AWS Cluster Autoscaler"}, {"id": "3.5-09", "obj": "3.5", "q": "NKP implements node pools using which Cluster API resource?", "o": ["MachineDeployments", "KubeadmControlPlanes", "ClusterResourceSets", "MachineHealthChecks"], "a": [0], "e": "NKP implements node pools using Cluster API MachineDeployments, which is why the autoscaler annotations are placed on MachineDeployments.", "r": "Manage Pre-provisioned Node Pools"}, {"id": "3.5-10", "obj": "3.5", "q": "Which command adds a new node pool to an existing NKP cluster on Nutanix?", "o": ["`nkp create nodepool nutanix -c ${CLUSTER_NAME} <nodepool-name>` with options such as `--vm-image`, `--subnets` and `--prism-element-cluster`", "`kubectl scale cluster ${CLUSTER_NAME} --pools=2`", "`nkp create cluster nutanix --add-pool`", "`nkp update nodepool nutanix --new`"], "a": [0], "e": "Node pools are added with `nkp create nodepool nutanix -c <cluster> <name>` plus image, subnet and Prism Element options; `--dry-run -o yaml` produces YAML to customize (for example for GPU pools).", "r": "Adding GPU Node Pool to a Nutanix Cluster"}, {"id": "3.5-11", "obj": "3.5", "q": "What happens when a node pool is deleted with `nkp delete nodepool ${NODEPOOL_NAME} --cluster-name=${CLUSTER_NAME}`?", "o": ["Its nodes are drained (pods rescheduled) and then the nodes and underlying infrastructure are deleted", "Only the Kubernetes Node objects are removed; VMs remain", "The pool is deleted immediately without draining", "The command is not supported on managed clusters"], "a": [0], "e": "Deleting a node pool deletes the Kubernetes nodes and the underlying infrastructure; all nodes are drained first and their pods rescheduled.", "r": "Deleting Pre-provisioned Node Pools"}, {"id": "3.6-01", "obj": "3.6", "q": "When upgrading NKP, which component must be upgraded first?", "o": ["Kommander (the management cluster and its platform applications)", "The Kubernetes version of the worker node pools", "The CAPI components", "Attached clusters"], "a": [0], "e": "Upgrade sequentially, starting with the Kommander component, then the Konvoy component (CAPI components, core addons, Kubernetes version). Upgrading Kommander first ensures changes for new Kubernetes APIs are already present.", "r": "Upgrade NKP"}, {"id": "3.6-02", "obj": "3.6", "q": "Which task is marked as REQUIRED before upgrading the Kommander component?", "o": ["Create a backup of the current configuration with Velero", "Delete all workspaces", "Remove the NKP license", "Uninstall Traefik"], "a": [0], "e": "The Kommander upgrade prerequisites mark 'Create a Backup and Restore of your current configuration with Velero before upgrading' as required.", "r": "Upgrade Prerequisites"}, {"id": "3.6-03", "obj": "3.6", "q": "Which command upgrades Kommander and all platform applications on the management cluster in a non-air-gapped environment?", "o": ["`nkp upgrade kommander`", "`nkp update kommander --all`", "`helm upgrade kommander`", "`nkp install kommander --upgrade`"], "a": [0], "e": "`nkp upgrade kommander` upgrades Kommander and the management cluster's platform apps. Air-gapped upgrades add `--charts-bundle` and `--kommander-applications-repository`; `--disable-appdeployments ai-navigator-app` disables AI Navigator.", "r": "Upgrade Kommander Examples"}, {"id": "3.6-04", "obj": "3.6", "q": "After upgrading Kommander on the management cluster (Ultimate), how are platform applications on managed and attached clusters upgraded?", "o": ["Run `nkp upgrade workspace ${WORKSPACE_NAME}` for each workspace before the Konvoy upgrade", "They are upgraded automatically by `nkp upgrade kommander`", "Reinstall each application from the catalog", "Run `nkp upgrade addons` on each cluster"], "a": [0], "e": "`nkp upgrade` handles the management cluster's kommander workspace, but for managed or attached clusters you must upgrade each workspace with `nkp upgrade workspace <name>`, before upgrading Konvoy/Kubernetes.", "r": "Ultimate: Upgrade Platform Applications on Managed and Attached Clusters"}, {"id": "3.6-05", "obj": "3.6", "q": "Which command upgrades the Cluster API components (core CAPI and infrastructure providers) on a management cluster?", "o": ["`nkp upgrade capi-components`", "`nkp upgrade cluster-api`", "`clusterctl upgrade apply`", "`nkp update providers`"], "a": [0], "e": "New NKP versions bundle newer CAPI and infrastructure providers; upgrade them first with `nkp upgrade capi-components` on each management cluster, reusing any flags used when the components were created.", "r": "Ultimate: Upgrade the Management Cluster CAPI Components"}, {"id": "3.6-06", "obj": "3.6", "q": "Which two statements about `nkp upgrade addons <provider> --cluster-name=<name>` are correct?", "o": ["It upgrades core addons such as CSI, CNI, Cluster Autoscaler and Node Feature Discovery that are installed through ClusterResourceSets", "Manual changes made to the ClusterResourceSet definitions are not preserved", "It upgrades the Kubernetes version of the control plane", "It must be run on each attached cluster", "It upgrades Kommander platform applications"], "a": [0, 1], "e": "Core addons (CSI, CNI, Cluster Autoscaler, Node Feature Discovery) are delivered via per-cluster ClusterResourceSets. `nkp upgrade addons` does not preserve modifications you made to them — save custom changes with --dry-run -o yaml and reapply.", "r": "Ultimate: Upgrade the Management Cluster Core Addons"}, {"id": "3.6-07", "obj": "3.6", "q": "In what order is the Kubernetes version of a cluster upgraded?", "o": ["Control plane first (`nkp update controlplane ...`), then each node pool (`nkp update nodepool ...`)", "Node pools first, then the control plane", "Both at once with `nkp upgrade kubernetes`", "Only the control plane; workers follow automatically"], "a": [0], "e": "Upgrade the control plane with `nkp update controlplane <provider> --kubernetes-version=...`, then upgrade every node pool with `nkp update nodepool <provider> <pool> --kubernetes-version=...`.", "r": "Ultimate: Upgrading the Management Cluster Kubernetes Version"}, {"id": "3.6-08", "obj": "3.6", "q": "Upgrading a node pool drains and replaces its nodes. What do the docs recommend to keep critical applications available during the upgrade?", "o": ["Deploy PodDisruptionBudgets for the critical applications", "Scale every deployment to zero", "Disable the MachineHealthChecks", "Pause the Cluster API controllers"], "a": [0], "e": "Node pool upgrades drain existing nodes and replace them. Deploy PodDisruptionBudgets (for example maxUnavailable: 1) so critical workloads stay available.", "r": "Upgrading Cluster Node Pools"}, {"id": "3.6-09", "obj": "3.6", "q": "How are attached clusters (for example EKS or AKS clusters attached to NKP) upgraded to a newer Kubernetes version?", "o": ["With the tool that created them; NKP does not upgrade their components", "With `nkp update controlplane attached`", "Automatically by `nkp upgrade kommander`", "By detaching, upgrading NKP, and reattaching"], "a": [0], "e": "Attached clusters are managed by their own provider. Use the tool that created the cluster to upgrade it, keeping it on a Kubernetes version NKP supports.", "r": "Ultimate: Upgrading Managed Clusters"}, {"id": "3.6-10", "obj": "3.6", "q": "Which upgrade paths to NKP 2.12 are supported?", "o": ["From DKP 2.8.0 or 2.8.1", "From DKP 2.5.x only", "From any 2.x release", "Only fresh installs; upgrades are not supported"], "a": [0], "e": "The supported upgrade path table shows that 2.12 can be reached from 2.8.0 and from 2.8.1.", "r": "Upgrade NKP"}, {"id": "3.6-11", "obj": "3.6", "q": "An NKP Ultimate customer uses workspace catalog applications. When should those applications be upgraded relative to the cluster upgrade?", "o": ["Before upgrading the Konvoy component on managed clusters (or Kubernetes on attached clusters), if the current version isn't compatible with the new Kubernetes version", "After all clusters are upgraded", "Never; catalog apps upgrade automatically", "Only after removing the Ultimate license"], "a": [0], "e": "If a catalog app version is incompatible with the new release's Kubernetes version, upgrade the app BEFORE upgrading Konvoy on managed clusters or Kubernetes on attached clusters.", "r": "Upgrade Prerequisites"}, {"id": "3.6-12", "obj": "3.6", "q": "An `nkp update controlplane` command fails with 'timed out waiting for the condition'. What is the default timeout, and what should the administrator check before retrying?", "o": ["30 minutes; check the control plane machines' versions with `kubectl get machines -o wide`", "5 minutes; restart the bootstrap cluster", "2 hours; check Velero backups", "There is no timeout; the command never times out"], "a": [0], "e": "`nkp update controlplane` has a 30-minute default timeout. Check the control plane nodes' versions with `kubectl get machines -o wide` before trying again.", "r": "Ultimate: Upgrading the Management Cluster Kubernetes Version"}, {"id": "3.6-13", "obj": "3.6", "q": "An NKP upgrade of Kommander fails. Which command gives more detail about what went wrong?", "o": ["`nkp upgrade kommander -v 6`", "`nkp upgrade kommander --debug-ui`", "`kubectl describe kommander`", "`nkp logs kommander`"], "a": [0], "e": "Rerun `nkp upgrade kommander -v 6` for verbose output. Broken HelmReleases can be reconciled by suspending and resuming them.", "r": "Ultimate: Upgrade the Management Cluster and Platform Applications"}, {"id": "3.6-14", "obj": "3.6", "q": "The Prism Central password used by NKP was changed. Which two actions are part of the documented procedure for updating the credentials on deployed NKP clusters?", "o": ["Scale down the CAPX controller manager, CAREN, Nutanix cloud controller manager and Nutanix CSI controllers before editing the secrets", "Update the `global-nutanix-credentials` secret in capx-system and each cluster's `<cluster-name>-pc-credentials` (and `-for-csi`) secrets", "Re-run `nkp create cluster nutanix` with the new password", "Delete and recreate the bootstrap cluster", "Change the password only in Prism Central; NKP picks it up automatically"], "a": [0, 1], "e": "The procedure scales down capx-controller-manager, cluster-api-runtime-extensions-nutanix (CAREN), nutanix-cloud-controller-manager and the Nutanix CSI controller/node pods, then updates global-nutanix-credentials, the per-cluster pc-credentials secrets, nutanix-ccm-credentials and nutanix-csi-credentials.", "r": "Updating Prism Central Credentials on Deployed NKP Clusters"}, {"id": "4.1-01", "obj": "4.1", "q": "What is an NKP workspace?", "o": ["A logical grouping of clusters that share a similar configuration, with certain configurations automatically federated to those clusters", "A single Kubernetes namespace on one cluster", "A Prism Central project used to host NKP VMs", "A Git repository that stores cluster manifests"], "a": [0], "e": "Workspaces let teams or tenants manage their own clusters; they can represent departments, products or business functions.", "r": "Workspaces"}, {"id": "4.1-02", "obj": "4.1", "q": "The NKP UI is organized for different roles at different levels. Which two statements are correct?", "o": ["At the Global level, IT administrators manage all clusters across all workspaces", "At the Project level, DevOps administrators or developers manage configuration and services across multiple clusters", "At the Project level, administrators manage Prism Central infrastructure", "The Workspace level is only available with NKP Starter", "At the Global level, developers deploy applications into a single namespace"], "a": [0, 1], "e": "Global: IT admins manage all clusters across workspaces. Workspace: DevOps admins manage multiple clusters within a workspace. Projects: DevOps admins or developers manage configuration and services across multiple clusters.", "r": "Workspaces"}, {"id": "4.1-03", "obj": "4.1", "q": "A cluster was attached to the wrong workspace. Can it be moved to another workspace?", "o": ["No — clusters cannot be moved between workspaces after they are created or attached", "Yes — drag the cluster card to the new workspace in the UI", "Yes — edit the workspace label on the KommanderCluster", "Yes — with `nkp move cluster --workspace`"], "a": [0], "e": "The docs warn that you cannot move clusters from one workspace to another after creating or attaching them, so plan workspaces before adding clusters.", "r": "Workspaces"}, {"id": "4.1-04", "obj": "4.1", "q": "How is a new workspace created in the NKP UI?", "o": ["From the workspace selection dropdown in the top menu bar, select Create Workspace, enter a name and description, and Save", "From Administration > Licensing, select Add Workspace", "From a project, select Promote to Workspace", "Workspaces can only be created with kubectl"], "a": [0], "e": "Select Create Workspace from the workspace dropdown, type a name and description, and click Save. Workspaces can also be created declaratively with a Workspace object.", "r": "Creating a Workspace"}, {"id": "4.1-05", "obj": "4.1", "q": "Labels are added to a workspace in its Advanced Options. Where are they applied?", "o": ["To the workspace namespace, and also to the KommanderCluster objects and all clusters in the workspace", "Only to the workspace display name", "Only to Prism Central VMs", "Only to new projects"], "a": [0], "e": "Annotations and labels are applied to the workspace namespace. Labels are also applied to the kommanderclusters objects and to all clusters in the workspace.", "r": "Adding or Editing Workspace Annotations and Labels"}, {"id": "4.1-06", "obj": "4.1", "q": "An administrator tries to delete a workspace, but the option fails. What is the most likely reason?", "o": ["The workspace still contains clusters; all clusters must be deleted or detached first", "Workspaces can only be deleted by Prism Central administrators", "The workspace has an identity provider configured", "The workspace has more than one project"], "a": [0], "e": "Workspaces can only be deleted if all clusters in the workspace have been deleted or detached. Delete from Global > Workspaces > three-dot menu > Delete.", "r": "Deleting a Workspace"}, {"id": "4.1-07", "obj": "4.1", "q": "Which two statements about the Management Cluster Workspace are correct?", "o": ["It is reserved for the management cluster; other clusters should not be attached to it", "It cannot be deleted from the GUI because it always contains the management cluster", "It can be renamed to default-workspace", "Clusters attached to it become self-managed", "It is created only with an NKP Starter license"], "a": [0, 1], "e": "When Kommander is installed, the host cluster is attached to the Management Cluster Workspace. Don't attach other clusters to it. The management cluster can't be disconnected from the GUI, so this workspace can't be deleted from the GUI.", "r": "Management Cluster"}, {"id": "4.1-08", "obj": "4.1", "q": "How can the management cluster be included in a project?", "o": ["Edit the management cluster to add labels, then use those labels in a project inside the Management Cluster Workspace", "Attach the management cluster to the default workspace", "It cannot be part of any project", "Create a second Kommander installation"], "a": [0], "e": "As an attached cluster, the management cluster can be edited to add or remove labels, and those labels can include it in projects inside the Management Cluster Workspace.", "r": "Management Cluster"}, {"id": "4.1-09", "obj": "4.1", "q": "Which command lists workspaces with both their names and their Kubernetes namespaces?", "o": ["`nkp get workspaces`", "`kubectl get ns -l workspace`", "`nkp list namespaces`", "`kubectl get projects -A`"], "a": [0], "e": "`nkp get workspaces` (or `kubectl get workspaces -A`) shows the NAME and NAMESPACE columns. The namespace may differ from the display name, and most CLI procedures need the namespace.", "r": "Creating AppDeployments to Enable Workspace Logging"}, {"id": "4.1-10", "obj": "4.1", "q": "Which Kubernetes resource represents a workspace when it is created declaratively?", "o": ["`Workspace` (workspaces.kommander.mesosphere.io/v1alpha1) with `spec.namespaceName`", "`Namespace` with the label `kommander.workspace=true`", "`KommanderCluster` with `spec.workspace`", "`Project` with `spec.type: workspace`"], "a": [0], "e": "A workspace is a `Workspace` object (apiVersion workspaces.kommander.mesosphere.io/v1alpha1) with a display-name annotation and `spec.namespaceName`.", "r": "CLI: Attaching a Network-Restricted Cluster Using a Tunnel Through the CLI"}, {"id": "4.1-11", "obj": "4.1", "q": "Where are infrastructure provider credentials (for example AWS or vSphere accounts used to create managed clusters) configured?", "o": ["In each workspace, under Administration > Infrastructure Providers; names must be unique across namespaces", "Only once, globally, in kommander.yaml", "In each project's Secrets tab", "On the bastion host only"], "a": [0], "e": "Infrastructure provider credentials are configured in each workspace (Administration > Infrastructure Providers), and the name must be unique across all the other namespaces in the cluster.", "r": "Infrastructure Providers"}, {"id": "4.1-12", "obj": "4.1", "q": "Which license tier is required for Workspaces management and adding new infrastructure providers?", "o": ["NKP Ultimate", "NKP Pro", "NKP Starter", "Any tier"], "a": [0], "e": "The license feature matrix lists Workspaces Management, Projects and Add new Infrastructure Provider under NKP Ultimate only.", "r": "Licenses"}, {"id": "4.1-13", "obj": "4.1", "q": "An infrastructure provider record must be deleted. What must happen first?", "o": ["All managed clusters created with that infrastructure provider must be deleted", "The workspace must be deleted", "The Kommander li
